name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `src` must be set: ruff-action appends it to the command and defaults
      # to the repo root, which (on ruff >=0.16) also format-checks Python
      # blocks inside markdown docs. Version pinned so a ruff release can't
      # break CI on an unrelated push; bump it deliberately.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          args: check
          src: orchestrator
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          args: format --check
          src: orchestrator

  check-dashboards:
    name: Grafana Dashboards In Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The Grafana JSON under provisioning/dashboards/json/ is GENERATED from the
      # Python builders in monitoring/grafana/dashgen/. Regenerate and fail if the
      # committed JSON differs — that means someone hand-edited the JSON (or a
      # Grafana-UI edit got snapshotted back into the repo) instead of editing the
      # builder. build.py uses only the stdlib, so there are no deps to install.
      - name: Regenerate dashboards from the dashgen builders
        run: python monitoring/grafana/dashgen/build.py
      - name: Fail if the committed JSON drifted from the builders
        run: |
          if git diff --exit-code -- monitoring/grafana/provisioning/dashboards/json/; then
            echo "Dashboards are in sync with monitoring/grafana/dashgen/."
          else
            echo "::error::Grafana dashboard JSON is out of sync with its dashgen builder (diff above)."
            echo "These JSON files are GENERATED — do not hand-edit them, and do not rely on Grafana-UI"
            echo "edits persisting. Edit the builder in monitoring/grafana/dashgen/dashboards/ instead."
            echo "Fix: cd monitoring/grafana/dashgen && python3 build.py, then commit the regenerated JSON."
            exit 1
          fi

  check-theme:
    name: Suite Theme In Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # frontend/src/styles/{tokens.css,theme-meta.ts} and theme/dist/* are
      # GENERATED from theme/tokens.json by theme/build.py (stdlib only).
      - name: Test the theme generator
        run: |
          pip install -q pytest pyyaml
          python -m pytest theme -q -p no:cacheprovider
      - name: Regenerate theme files
        run: python theme/build.py
      - name: Fail if the committed theme files drifted from tokens.json
        run: |
          # status --porcelain also catches a new output nobody committed.
          if git diff --exit-code -- frontend/src/styles/ theme/dist/ \
             && [ -z "$(git status --porcelain -- frontend/src/styles/ theme/dist/)" ]; then
            echo "Theme files are in sync with theme/tokens.json."
          else
            echo "::error::Generated theme files are out of sync with theme/tokens.json (diff above)."
            echo "Edit theme/tokens.json (or theme/build.py), never the generated files."
            echo "Fix: python3 theme/build.py, then commit the regenerated files."
            exit 1
          fi

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    # Usually ~4 min (max ~7 min). A stuck run otherwise holds the runner for
    # GitHub's 360-min default: two tests with MB-long ids stalled "Run tests"
    # for 25+ min (conftest.py now refuses ids over 300 chars).
    timeout-minutes: 15
    needs: lint-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r orchestrator/requirements.txt
          pip install pytest pytest-asyncio respx
      - name: Run tests
        run: python -m pytest orchestrator/tests/ -v

  lint-frontend:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npx eslint src/
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test

  docker-build:
    name: Docker Build (orchestrator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint-python, test-python]
    steps:
      - uses: actions/checkout@v7
      - name: Build orchestrator image
        run: docker build -t brain-orchestrator:test orchestrator/

  deploy:
    name: Deploy to Jupiter
    # Self-hosted runner on Jupiter (the always-on box). Registered as
    # `actions.runner.mexirab-brain_gateway.jupiter.service` in systemd on Jupiter,
    # polls GitHub Actions for jobs, executes them locally as labadmin.
    # Jupiter is always on (unlike Helios, which is powered off most of the time
    # post power-tiering) so auto-deploy is reliable. The orchestrator + frontend
    # now run on Jupiter; Helios is model-layer only.
    runs-on: [self-hosted, linux, jupiter]
    # List EVERY other job here: the fast-forward step's catch-up treats a
    # commit as passed only once all non-deploy jobs succeeded, and counts
    # them against this list.
    needs: [lint-python, test-python, lint-frontend, docker-build, check-dashboards, check-theme]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize deploys. The runner deploys from ONE shared checkout at
    # /home/labadmin/gateway_nerves; rapid successive merges must not race on it
    # (two concurrent `git pull`s advancing the checkout past each other made the
    # old rebuild decision see an empty diff and silently skip). cancel-in-progress
    # is false so a running deploy is never killed. But GitHub keeps only ONE
    # pending run per group and cancels it when another arrives, in any commit
    # order: the catch-up in the fast-forward step deploys a newer commit whose
    # own run was dropped that way. So cancelling a deploy run no longer holds
    # its commit back once an older deploy is still to run; to hold deploys,
    # stop the runner service on Jupiter instead.
    concurrency:
      group: deploy-jupiter
      cancel-in-progress: false
    # The catch-up reads other commits' CI runs. The repo's default token is
    # contents-only; nothing in this job writes to GitHub.
    permissions:
      contents: read
      actions: read
    # Usually under 3 min; a requirements.txt change rebuilds the orchestrator's
    # pip layer and a frontend change runs a full Next.js build, plus up to
    # ~4 min of SearXNG/Grist/Loki health waits. A hung step otherwise holds
    # the deploy-jupiter group, and every deploy pending behind it, for
    # GitHub's 360-min default. A timed-out deploy writes no marker, so a
    # re-run (or the next push's deploy) rebuilds the same changes; until then
    # the box may be half-deployed.
    timeout-minutes: 45
    # The runner runs on Jupiter with docker access, so we don't need a checkout
    # step — we operate directly on the live checkout at /home/labadmin/gateway_nerves.
    steps:
      - name: Fast-forward the deploy checkout
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          # Never fall back to the runner user's own gh login.
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-empty
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          cd /home/labadmin/gateway_nerves

          WANT="$(jq length <<<"$NEEDS_JSON")"
          # Did commit $1's push run of this workflow pass every job but the
          # deploy? 0 = yes, 1 = no / not yet / no such run, 2 = couldn't ask.
          gh_api() { timeout 30 gh api "$@" || { sleep 3; timeout 30 gh api "$@"; }; }
          ci_passed() {
            local run ok
            run="$(gh_api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .head_sha == \"$1\" and .event == \"push\" and .head_branch == \"main\")] | max_by(.run_number) | .id // empty")" || return 2
            [ -n "$run" ] || return 1
            # Keep "Deploy to Jupiter" in sync with this job's name.
            ok="$(gh_api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name != \"Deploy to Jupiter\")] | length >= ${WANT} and all(.conclusion == \"success\")")" || return 2
            [ "$ok" = true ]
          }
          # Step 2 below is THIS run's copy of the deploy logic, so it may only
          # build a tree whose deploy job is the same.
          same_deploy_job() { git diff --quiet "$DEPLOY_SHA" "$1" -- .github/workflows/ci.yml; }

          BRANCH="$(git symbolic-ref --short -q HEAD || true)"
          if [ "$BRANCH" != main ]; then
            echo "::error::The deploy checkout at /home/labadmin/gateway_nerves is not on main (on '${BRANCH:-detached HEAD}'). Run: cd /home/labadmin/gateway_nerves && git status"
            exit 1
          fi
          # docker compose builds from the working tree, so a local edit would
          # ship without CI, and an untracked compose(.override) file at the
          # root would be merged into every `docker compose up`. Gitignored
          # files (.env, renders, node_modules) don't count. Only a count is
          # printed: this repo's CI logs are public.
          DIRTY="$( { git status --porcelain --untracked-files=no
                      git status --porcelain --untracked-files=normal -- orchestrator frontend \
                        compose.yaml compose.yml compose.override.yaml compose.override.yml \
                        docker-compose.override.yaml docker-compose.override.yml; } | sort -u | wc -l)"
          if [ "$DIRTY" -ne 0 ]; then
            echo "::error::The deploy checkout at /home/labadmin/gateway_nerves has $DIRTY local change(s) (tracked files, new files under orchestrator/ or frontend/, or a compose override) that would be deployed without CI. Run: cd /home/labadmin/gateway_nerves && git status"
            exit 1
          fi

          # Fetch without writing .git/FETCH_HEAD and merge explicit SHAs, so
          # nothing here reads FETCH_HEAD: a fetch run in this checkout by
          # something else (linked worktrees keep their own FETCH_HEAD)
          # rewrote it under `git pull` and failed a deploy ("Cannot
          # fast-forward to multiple branches"). Retried because a concurrent
          # fetch can hold the shared origin/main ref lock for a moment.
          fetched=false
          for attempt in 1 2 3; do
            if timeout 60 git fetch --quiet --no-write-fetch-head origin main; then fetched=true; break; fi
            echo "::warning::git fetch origin main failed (attempt $attempt of 3)"
            [ "$attempt" = 3 ] || sleep 5
          done
          if [ "$fetched" != true ]; then
            echo "::error::Could not fetch origin main into the deploy checkout. Re-run this job once github.com is reachable from Jupiter."
            exit 1
          fi

          # Ship the commit whose checks passed (DEPLOY_SHA), not whatever
          # main's tip is by now, and only while it is still on main.
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/origin/main 2>/dev/null; then
            echo "::error::Commit $DEPLOY_SHA is not on origin/main (was main force-pushed?), so it is not deployed."
            exit 1
          fi
          BEFORE="$(git rev-parse HEAD)"
          # A no-op when HEAD already contains DEPLOY_SHA (an earlier deploy
          # caught up past it).
          if ! git merge --ff-only --quiet "$DEPLOY_SHA"; then
            echo "::error::git merge --ff-only $DEPLOY_SHA failed — the deploy checkout at /home/labadmin/gateway_nerves is dirty or diverged (or another git process holds its lock). Run: cd /home/labadmin/gateway_nerves && git status"
            git status --short --untracked-files=no || true
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The deploy checkout at /home/labadmin/gateway_nerves has commits that are not on origin/main. Run: cd /home/labadmin/gateway_nerves && git status"
            exit 1
          fi
          # The checkout was already past DEPLOY_SHA and the last deploy: a
          # manual pull, or a deploy that stopped partway. Build it only on
          # the same terms as the catch-up below.
          if ! git merge-base --is-ancestor "$BEFORE" "$DEPLOY_SHA" \
              && [ "$BEFORE" != "$(cat .last-deployed-sha 2>/dev/null || true)" ]; then
            rc=0
            ci_passed "$BEFORE" || rc=$?
            if [ "$rc" = 1 ] || ! same_deploy_job "$BEFORE"; then
              echo "::error::The checkout is already at $BEFORE, past $DEPLOY_SHA and the last deploy (a manual pull, or a deploy that stopped partway), and that commit's CI has not passed or it changes the deploy job. Its own deploy run deploys it: wait for that, or re-run it if it shows as cancelled or failed."
              exit 1
            fi
            echo "::warning::The checkout was already $(git rev-list --count "$DEPLOY_SHA..$BEFORE") commit(s) past $DEPLOY_SHA and the last deploy (a manual pull, or a deploy that stopped partway). They deploy too."
          fi

          # Catch-up: also fast-forward to the newest commit on main whose CI
          # jobs (all but this deploy) passed and whose deploy job is this
          # one. Its own deploy may have been cancelled as the pending run (see
          # concurrency above); when it does run it finds nothing to do, so a
          # burst of merges also recreates containers once. Best effort: if
          # GitHub can't be asked, only DEPLOY_SHA ships.
          HEAD_SHA="$(git rev-parse HEAD)"
          TIP="$(git rev-parse refs/remotes/origin/main)"
          if [ "$TIP" != "$HEAD_SHA" ]; then
            outcome="none"
            for c in $(git rev-list --first-parent --max-count=20 "${HEAD_SHA}..${TIP}"); do
              # Newest first, so once one commit changes the deploy job every
              # newer one does too: skip down to the commits before it.
              if ! same_deploy_job "$c"; then
                if [ "$outcome" = none ]; then
                  echo "::warning::A newer commit on main changes the deploy job, so this run does not deploy it or anything after it; their own deploy runs do. If one shows as cancelled, re-run it."
                  outcome="deploy_job_changed"
                fi
                continue
              fi
              rc=0
              ci_passed "$c" || rc=$?
              if [ "$rc" = 0 ]; then
                if git merge --ff-only --quiet "$c"; then
                  echo "Also deploying $c: newer on main, and its CI passed."
                  outcome="caught_up"
                else
                  echo "::warning::Could not fast-forward to $c (newer on main, CI passed), so only $DEPLOY_SHA deploys. If its deploy run shows as cancelled, re-run it."
                  outcome="merge_failed"
                fi
                break
              elif [ "$rc" = 2 ]; then
                echo "::warning::Could not read newer commits' CI from GitHub, so only $DEPLOY_SHA deploys. If a newer commit's deploy run shows as cancelled, re-run it."
                outcome="unknown"
                break
              fi
            done
            if [ "$outcome" = none ]; then
              echo "main is at $TIP; its newer commits are still in CI (or failed) and deploy on their own runs."
            fi
          fi

      - name: Rebuild changed services
        run: |
          set -euo pipefail
          cd /home/labadmin/gateway_nerves

          # Decide what to rebuild by diffing against the LAST-DEPLOYED commit
          # (recorded in .last-deployed-sha), NOT against the fast-forward
          # above. The checkout is shared and can be advanced out-of-band (a
          # deploy that stopped partway, or a manual `git pull` during ops), so
          # a no-op fast-forward does NOT mean nothing changed relative to
          # what's actually running. The marker is the source of truth for
          # "what's currently deployed."
          MARKER=.last-deployed-sha
          LAST="$(cat "$MARKER" 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD)"

          # First run (no/invalid marker): fall back to the parent so we still
          # rebuild whatever this push changed.
          if [ -z "$LAST" ] || ! git cat-file -e "${LAST}^{commit}" 2>/dev/null; then
            LAST="$(git rev-parse HEAD~1)"
          fi

          if [ "$LAST" = "$HEAD_SHA" ]; then
            echo "Already deployed $HEAD_SHA — nothing to do."
            exit 0
          fi

          echo "Rebuilding for changes ${LAST}..${HEAD_SHA}:"
          # --no-renames: a rename lists only its new path, so a file moved out
          # of a trigger path would otherwise skip the rebuild it needs.
          CHANGED="$(git diff --no-renames --name-only "$LAST" "$HEAD_SHA")"
          echo "$CHANGED"

          # SearXNG takes server.secret_key from SEARXNG_SECRET in .env and won't
          # start without it. Checked before anything is rebuilt, so a missing
          # secret recreates nothing. (searxng/settings.yml has no secret_key,
          # so the running container would also crash on its next restart.)
          if grep -qE "^searxng/|^docker-compose\.yml$" <<<"$CHANGED" \
              && ! grep -qE '^SEARXNG_SECRET=[^[:space:]]{32,}$' .env; then
            echo "::error::SEARXNG_SECRET missing from .env — SearXNG refuses to start without it, and the running searxng will crash on its next restart until it is added. Add one: python3 -c 'import secrets; print(\"SEARXNG_SECRET=\" + secrets.token_hex(32))' >> .env, then re-run this job."
            exit 1
          fi

          # data/palace.yaml is a single-file bind mount read once at startup:
          # a git pull swaps its inode, so only a recreate picks the change up.
          # Keep this before the SearXNG step: the recreate puts the
          # orchestrator on searxng-net (and creates that network), so searxng
          # can then leave gateway-net without cutting Jess's web search off.
          # orchestrator/tests/ is not in the image (the Dockerfile copies only
          # requirements.txt and orchestrator/*.py), and a recreate drops
          # RAM-only state (pending auto_learn jobs, one-reply voice styles),
          # so a tests-only change does not rebuild.
          ORCH_CHANGED="$(grep -vE '^orchestrator/tests/' <<<"$CHANGED" || true)"
          if grep -qE "^orchestrator/|^docker-compose\.yml$|^data/palace\.yaml$" <<<"$ORCH_CHANGED"; then
            echo "::group::Rebuilding orchestrator"
            docker compose up -d --build --force-recreate orchestrator
            echo "::endgroup::"
          fi

          if grep -qE "^frontend/|^docker-compose\.yml$" <<<"$CHANGED"; then
            echo "::group::Rebuilding frontend"
            docker compose up -d --build --force-recreate frontend
            echo "::endgroup::"
          fi

          # Runs after the orchestrator step (searxng-net, above) and before the
          # monitoring step: it creates searxng-probe-net, which
          # blackbox-exporter joins as external. settings.yml is a
          # single-file mount (a git pull swaps its inode), so a change there
          # needs --force-recreate; for compose edits a plain `up` recreates
          # only if searxng's own config changed (a recreate also resets
          # SearXNG's engine suspensions). SEARXNG_SECRET was checked above.
          # Never print its logs here: they carry upstream URLs with the
          # search text, and this repo's CI logs are public.
          if grep -qE "^searxng/|^docker-compose\.yml$" <<<"$CHANGED"; then
            echo "::group::Updating SearXNG"
            if grep -qE "^searxng/" <<<"$CHANGED"; then
              docker compose up -d --force-recreate searxng
            else
              docker compose up -d searxng
            fi
            # `compose port` prints 127.0.0.1:<SEARXNG_PORT>; empty while the
            # container is restarting.
            searxng_ok=false
            for i in $(seq 1 30); do
              addr="$(docker compose port searxng 8080 2>/dev/null || true)"
              if [ -n "$addr" ] && curl -sf -m 5 "http://${addr}/healthz" >/dev/null; then searxng_ok=true; break; fi
              sleep 2
            done
            if [ "$searxng_ok" != true ]; then
              echo "::error::SearXNG not up after 60s. Read 'docker logs searxng' on Jupiter."
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' searxng || true
              exit 1
            fi
            # The check above goes through the host port. Jess calls
            # SEARXNG_URL over searxng-net, which only the orchestrator shares,
            # and SearXNGDown probes over searxng-probe-net, so neither would
            # notice the orchestrator missing that network. /healthz only.
            orch_ok=false
            for i in $(seq 1 10); do
              if docker exec brain-orchestrator python -c "import os, httpx; httpx.get(os.environ['SEARXNG_URL'].rstrip('/') + '/healthz', timeout=5).raise_for_status()" >/dev/null 2>&1; then orch_ok=true; break; fi
              sleep 3
            done
            if [ "$orch_ok" != true ]; then
              echo "::error::brain-orchestrator can't reach SearXNG at \$SEARXNG_URL (web search is down). Is it on gateway_nerves_searxng-net? docker inspect -f '{{json .NetworkSettings.Networks}}' brain-orchestrator; fix with: docker compose up -d orchestrator"
              exit 1
            fi
            # Runtime twin of test_searxng_hardening.py: a manual `docker
            # network connect` or a leftover container would give searxng a
            # neighbour the compose files don't show. blackbox-exporter joins
            # the probe network in the monitoring step below, so it may be
            # missing here.
            sorted_words() { xargs -n1 | sort | xargs; }
            sx_nets="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' searxng | sorted_words)"
            sx_peers="$(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' gateway_nerves_searxng-net | sorted_words)"
            probe_peers="$(docker network inspect -f '{{range .Containers}}{{.Name}} {{end}}' gateway_nerves_searxng-probe-net | sorted_words)"
            if [ "$sx_nets" != "gateway_nerves_searxng-net gateway_nerves_searxng-probe-net" ] \
                || [ "$sx_peers" != "brain-orchestrator searxng" ] \
                || ! grep -qxE 'searxng|blackbox-exporter searxng' <<<"$probe_peers"; then
              echo "::error::Unexpected SearXNG networking: searxng is on [$sx_nets], gateway_nerves_searxng-net holds [$sx_peers], gateway_nerves_searxng-probe-net holds [$probe_peers]. Expected searxng on gateway_nerves_searxng-net + gateway_nerves_searxng-probe-net only, brain-orchestrator + searxng alone on searxng-net, and at most blackbox-exporter beside searxng on the probe network. Remove the extra with docker network disconnect <network> <container>."
              exit 1
            fi
            echo "::endgroup::"
          fi

          # Grist (own compose project) mounts theme/dist/grist.css as a single
          # file — a git pull swaps its inode, so only a recreate applies a
          # theme change. `up -d` returns 0 even if Grist then fails to start,
          # so check /status before going green.
          if grep -qE "^grist/docker-compose\.yml$|^theme/dist/grist\.css$" <<<"$CHANGED"; then
            echo "::group::Recreating Grist"
            docker compose -f grist/docker-compose.yml up -d --force-recreate grist
            for i in $(seq 1 30); do curl -sf -m 5 http://127.0.0.1:8484/status >/dev/null && break; sleep 2; done
            curl -sf -m 5 http://127.0.0.1:8484/status >/dev/null || { echo "Grist not up after 60s"; docker logs --tail 30 grist; exit 1; }
            echo "::endgroup::"
          fi

          # Monitoring configs are rendered + live-mounted from this checkout
          # (prometheus.yml and alertmanager.yml come from *.template via
          # scripts/generate-configs.sh), and the containers only re-read them
          # on an explicit reload. Without this, template/rule changes merge
          # green but never reach the running stack (bit us during PR #54).
          # One trigger → render + reload BOTH: the generator rewrites both
          # outputs and validates them pre-write, and a rendered-but-not-
          # reloaded file would surprise-apply at the next unrelated restart.
          # Herestrings (not `echo |`) so grep -q can't SIGPIPE-skip a match
          # on a huge changeset under pipefail.
          if grep -qE "^monitoring/(prometheus|alertmanager|blackbox|loki|loki-push-gw)/|^monitoring/docker-compose\.yml$|^scripts/(generate-configs|reload-monitoring)\.sh$" <<<"$CHANGED"; then
            echo "::group::Re-rendering monitoring configs"
            bash scripts/generate-configs.sh
            echo "::endgroup::"

            # Renders exist before `up` — compose bind-mounts them, and docker
            # auto-creates a directory (breaking the mount) if a source file
            # is missing at container create time.
            if grep -qE "^monitoring/docker-compose\.yml$" <<<"$CHANGED"; then
              echo "::group::Reconciling monitoring stack (compose)"
              docker compose -f monitoring/docker-compose.yml --env-file .env -p monitoring up -d --remove-orphans
              echo "::endgroup::"
            fi

            # Loki and the push gateway read their config only at start, and
            # Loki's config is a single-file mount (pinned to the old inode
            # after git replaces it), so a content change needs a recreate.
            # Rule files under monitoring/loki/rules/ are a directory mount the
            # ruler re-reads every minute — no restart for those.
            if grep -qE "^monitoring/loki/loki-config\.yml$" <<<"$CHANGED"; then
              echo "::group::Recreating Loki (config changed)"
              docker compose -f monitoring/docker-compose.yml --env-file .env -p monitoring up -d --force-recreate --no-deps loki
              echo "::endgroup::"
            fi
            # `up -d` returns 0 even if Loki then crash-loops on a bad config;
            # fail the deploy instead of going green with logging down.
            if grep -qE "^monitoring/(loki|loki-push-gw)/|^monitoring/docker-compose\.yml$" <<<"$CHANGED"; then
              echo "::group::Checking Loki + loki-push-gw health"
              for i in $(seq 1 30); do curl -sf -m 5 http://127.0.0.1:3100/ready >/dev/null && break; sleep 2; done
              curl -sf -m 5 http://127.0.0.1:3100/ready >/dev/null || { echo "Loki not ready after 60s"; docker logs --tail 30 loki; exit 1; }
              # The gateway fails closed with no server block if its template
              # didn't render (e.g. tmpfs not writable) — check it rendered.
              docker exec loki-push-gw nginx -T 2>/dev/null | grep -q "location = /loki/api/v1/push" \
                || { echo "loki-push-gw has no push location"; docker logs --tail 30 loki-push-gw; exit 1; }
              echo "::endgroup::"
            fi
            if grep -qE "^monitoring/loki-push-gw/" <<<"$CHANGED"; then
              echo "::group::Recreating loki-push-gw (template changed)"
              docker compose -f monitoring/docker-compose.yml --env-file .env -p monitoring up -d --force-recreate --no-deps loki-push-gw
              echo "::endgroup::"
            fi

            echo "::group::Reloading + verifying Prometheus, Alertmanager and Blackbox"
            bash scripts/reload-monitoring.sh
            echo "::endgroup::"
          fi

          # Record what we just deployed so the next run diffs from here.
          echo "$HEAD_SHA" > "$MARKER"
          echo "Deploy complete at $(date -Iseconds)"

      - name: Health check
        run: |
          set -eu
          # Retry each service briefly (a just-recreated container can take a
          # few seconds to listen) and fail the deploy if either stays down.
          # 127.0.0.1, not localhost: ports may be published on IPv4 loopback
          # only, and localhost can resolve to ::1.
          wait_for() {
            for _ in 1 2 3 4 5 6 7 8; do
              if curl -sSf -m 5 -o /dev/null "$2"; then echo "$1 reachable"; return 0; fi
              sleep 5
            done
            echo "::error::$1 not reachable at $2 after 40 s"
            return 1
          }
          failed=0
          wait_for orchestrator http://127.0.0.1:8888/health || failed=1
          wait_for frontend http://127.0.0.1:3001 || failed=1
          exit "$failed"
