# ATOM Echo S3R — "Hey Jess" voice satellite (talks to Jess directly, no HA voice pipeline)
# ======================================================================================
# M5Stack ATOM Echo S3R (ESP32-S3 + 8 MB PSRAM + ES8311 codec + NS4150B amp).
# Hardware section based on the official M5Stack config (2026.1.2).
#
# Role: wake word ON the device + microphone. After "Hey Jess" / "Okay Jess"
# the device beeps and streams its mic over the ESPHome native API to the
# orchestrator's voice satellite bridge (orchestrator/voice_satellite.py), which
# runs speech detection, STT, Jess, and plays the answer on the room's Google
# speaker through Home Assistant. Nothing is spoken on the device itself except
# short sounds.
#
# The device must NOT be in Home Assistant's ESPHome integration (it takes one
# voice-assistant client; HA and Jess would fight over it).
#
# Files next to this YAML: secrets.yaml (gitignored — wifi_ssid, wifi_password,
# api_encryption_key, ota_password, ap_password), hey_jess.json + hey_jess.tflite
# (okay_jess.json + okay_jess.tflite only if you uncomment that model below).
#
# Build + flash: see docs/VOICE_AND_TTS.md → Voice satellite. The node name is
# a substitution; the office unit keeps its existing identity with
#   esphome -s name atom-echo-office -s friendly_name "Office Mic" run atom-echo-jess.yaml --device <ip>
# and VOICE_SATELLITE_NAME must match the name the device runs.
#
# Sounds the bridge asks for (VOICE_ASSISTANT_ERROR codes → on_error below):
#   jess-no-speech  nothing heard after the wake word
#   jess-busy       still answering the last question
#   jess-waking     Helios (the GPU box) was asleep; waking it — answer comes later
#   jess-asleep     Helios asleep and waking is turned off
#   jess-error      something failed
# Sound files: Home Assistant Voice PE sounds © 2024 Clayton Charles Tapp,
# CC BY 4.0 (github.com/esphome/home-assistant-voice-pe/tree/dev/sounds).
# The mapping below is a first guess — swap files by ear during bring-up.

substitutions:
  name: atom-echo-jess
  friendly_name: Jess Voice Satellite
  # Pinned to a commit (the dev branch can change under a rebuild)
  sounds: https://github.com/esphome/home-assistant-voice-pe/raw/a5429c2b6d92e6c726b058dc5496d879c56374cd/sounds

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: brain-gateway.jess-voice
    version: "2.0.0"
  min_version: 2026.1.0
  on_boot:
    - priority: 600
      then:
        # Safety timeout: if Jess never connects, clear the init flag after 30s
        - delay: 30s
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
    - priority: -100
      then:
        # Listen for the wake word from boot, even before Jess connects: you
        # get the beep (and "Detected" in the log); with no client connected
        # ESPHome only logs "No API client connected" — no error sound (its
        # on_error doesn't fire for that). Lets the wake words be tested
        # before the bridge is running.
        - wait_until:
            condition:
              wifi.connected:
            timeout: 60s
        - script.execute: start_wake_word

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # Don't reboot every 15 min while Jess isn't connected (Jupiter restart,
  # bridge disabled, bring-up before the bridge exists).
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Atom-Echo-Jess"
    password: !secret ap_password

captive_portal:

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

# =============================================================================
# Hardware: ES8311 codec over I2C, shared I2S bus for mic + speaker
# =============================================================================

i2c:
  sda:
    number: GPIO45
    ignore_strapping_warning: true
  scl:
    number: GPIO0
    ignore_strapping_warning: true
  scan: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

audio_dac:
  - platform: es8311
    id: es8311_dac
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: echo_mic
    i2s_din_pin: GPIO4
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    # Remove any constant DC offset (a ~2.5 Hz high-pass; no gain change).
    # The bridge finds speech by loudness and also removes the offset per
    # frame; measured 2026-11-11 this unit's offset was small (|dc| < 0.01).
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_dout_pin: GPIO48
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac

# Media player wraps the speaker for proper I2S bus arbitration
# (mic and speaker share one bus — cannot run simultaneously). Used for the
# short sounds only; Jess's answers play on the Google speaker.
media_player:
  - platform: speaker
    name: None
    id: echo_media_player
    volume_min: 0.5
    volume_max: 0.8
    announcement_pipeline:
      speaker: echo_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    files:
      - id: wake_sound
        file: ${sounds}/wake_word_triggered.flac
      - id: no_speech_sound
        file: ${sounds}/mute_switch_on.flac
      - id: busy_sound
        file: ${sounds}/center_button_double_press.flac
      - id: waking_sound
        file: ${sounds}/center_button_long_press.flac
      - id: error_sound
        file: ${sounds}/jack_disconnected.flac
    on_announcement:
      # Safety net: stop the wake word listener to free the I2S bus for
      # playback (the wake beep and play_sound already stop it first).
      - if:
          condition:
            microphone.is_capturing:
          then:
            - micro_wake_word.stop
    # No on_idle restart of the wake word: after the wake beep it restarted
    # listening during the voice run, so a second "Hey Jess" mid-run tried
    # to beep while the mic held the bus — the speaker retried forever and
    # the device went deaf (first live test, 2026-11-11). Whoever plays a
    # sound restarts the wake word itself when done.

# =============================================================================
# Voice: on-device wake words → Jess's voice satellite bridge
# =============================================================================

micro_wake_word:
  id: mww
  microphone: echo_mic
  stop_after_detection: false
  models:
    # Trained on Saturn 2026-01-26. Manifest = the TRAINER's values
    # (probability_cutoff 0.97, tensor_arena_size 30000). Tested on the
    # device 2026-11-11: it also fires on "Okay Jess" (0.98–0.99) and on
    # other "-ay Jess" phrases, so it covers both wake words on its own.
    - model: hey_jess.json
      id: hey_jess
    # "Okay Jess" model (microwakeword.com 2026-11-10, "robust" variant;
    # manifest as delivered: probability_cutoff 0.35 = the threshold its
    # benchmark was measured at, recall 86.2% / 0.38 false accepts per hour;
    # its cutoff scale differs from hey_jess's). Left out: hey_jess always
    # fired first on "Okay Jess", so it added only a second way to wake by
    # accident. Uncomment to bring it back:
    # - model: okay_jess.json
    #   id: okay_jess
    # (The stock okay_nabu model was a bring-up control only. Removed
    # 2026-11-10 once "Hey Jess" worked on the device: it is said in many
    # public Home Assistant videos, so it's an easy false/remote trigger.)
  on_wake_word_detected:
    # Stop listening first (frees the shared I2S bus for the beep) -> amp on
    # -> beep -> wait for it (bounded) -> amp off -> start the voice run.
    - micro_wake_word.stop:
    - wait_until:
        condition:
          not:
            micro_wake_word.is_running:
        timeout: 1s
    - switch.turn_on: speaker_amp
    - lambda: |-
        id(echo_media_player)
          ->play_file(id(wake_sound), true, false);
    - wait_until:
        condition:
          media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing:
            - not:
                speaker.is_playing:
        timeout: 3s
    # A sound that still hasn't finished (bus taken) is cancelled, so the
    # media player can't keep retrying it in the background.
    - if:
        condition:
          media_player.is_announcing:
        then:
          - lambda: |-
              id(echo_media_player)->make_call()
                .set_command(media_player::MEDIA_PLAYER_COMMAND_STOP)
                .set_announcement(true)
                .perform();
    - switch.turn_off: speaker_amp
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    # Jess not connected: the run never starts ("No API client connected",
    # no error event) — go back to listening for the wake word.
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - script.execute: start_wake_word

voice_assistant:
  id: va
  microphone: echo_mic
  # No speaker/media_player here: answers play on the Google speaker, and the
  # mic + speaker share one I2S bus on the ATOM Echo S3R.
  micro_wake_word: mww
  # No noise_suppression_level / auto_gain / volume_multiplier: ESPHome only
  # sends those to the server as hints (Home Assistant applies them); the
  # device streams raw audio and the Jess bridge ignores them.

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
  # Jess went away (orchestrator restart, network): keep listening for the
  # wake word, so "Hey Jess" still beeps (no answer = Jess isn't connected —
  # see the satellite alert). A run cut off by the disconnect goes idle
  # without on_end/on_error, so restart the wake word here.
  on_client_disconnected:
    - wait_until:
        condition:
          not:
            voice_assistant.is_running:
        timeout: 3s
    - script.execute: start_wake_word

  on_end:
    # The bridge ends the run as soon as it has your question — listen
    # again once the voice assistant has actually let go of the mic. If an
    # outcome sound is playing (on_error -> play_sound), leave it: play_sound
    # restarts the wake word itself, and starting it now would take the
    # bus from the sound.
    - wait_until:
        condition:
          not:
            voice_assistant.is_running:
        timeout: 3s
    - if:
        condition:
          not:
            script.is_running: play_sound
        then:
          - script.execute: start_wake_word

  on_error:
    - if:
        condition:
          lambda: return id(init_in_progress);
        then:
          - logger.log: "voice error during init — ignored"
        else:
          - if:
              condition:
                lambda: return code == "jess-no-speech";
              then:
                - script.execute: { id: play_sound, sound: 1 }
              else:
                - if:
                    condition:
                      lambda: return code == "jess-busy";
                    then:
                      - script.execute: { id: play_sound, sound: 2 }
                    else:
                      - if:
                          condition:
                            lambda: return code == "jess-waking";
                          then:
                            - script.execute: { id: play_sound, sound: 3 }
                          else:
                            - script.execute: { id: play_sound, sound: 4 }

# =============================================================================
# Controls
# =============================================================================

binary_sensor:
  - platform: gpio
    id: wake_button
    name: "Wake Button"
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    on_multi_click:
      # Short press: talk without the wake word (push-to-talk)
      - timing:
          - ON for at least 50ms
          - OFF for at least 50ms
        then:
          - micro_wake_word.stop
          # stop() only flags the stop; wait for it, or a start_wake_word
          # below would be ignored ("already running") and then stopped.
          - wait_until:
              condition:
                not:
                  micro_wake_word.is_running:
              timeout: 1s
          - voice_assistant.start
          # Jess not connected: the run never starts — listen again
          - if:
              condition:
                not:
                  voice_assistant.is_running:
              then:
                - script.execute: start_wake_word
      # Long press (10s): factory reset
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

switch:
  # NS4150B amplifier — defaults OFF (mic-only device), toggled ON for sounds
  - platform: gpio
    name: Speaker Enable
    id: speaker_amp
    pin: GPIO18
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  # Software mic mute
  - platform: template
    name: Microphone Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - microphone.mute:
      - micro_wake_word.stop
    on_turn_off:
      - microphone.unmute:
      - script.execute: start_wake_word

# =============================================================================
# Scripts & Globals
# =============================================================================

script:
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - switch.is_off: mute
              # never while a sound plays: the mic would take the shared bus
              - switch.is_off: speaker_amp
          then:
            # The wake word runs on the device (never server-side)
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:

  # sound: 1 no speech, 2 busy, 3 waking Helios, 4 error
  - id: play_sound
    mode: restart
    parameters:
      sound: int
    then:
      # Free the shared I2S bus first — from the voice assistant (an error
      # can arrive while it still streams) and from the wake word (stopped
      # twice: a start that was already pending when we stopped it takes
      # effect a loop later). Every wait is bounded, so a sound that can't
      # play never leaves the device deaf.
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 1s
      - micro_wake_word.stop:
      - wait_until:
          condition:
            not:
              micro_wake_word.is_running:
          timeout: 1s
      - delay: 100ms
      - micro_wake_word.stop:
      - wait_until:
          condition:
            not:
              micro_wake_word.is_running:
          timeout: 1s
      - switch.turn_on: speaker_amp
      - lambda: |-
          const audio::AudioFile *f = id(error_sound);
          if (sound == 1) f = id(no_speech_sound);
          else if (sound == 2) f = id(busy_sound);
          else if (sound == 3) f = id(waking_sound);
          id(echo_media_player)->play_file(f, true, false);
      - wait_until:
          condition:
            media_player.is_announcing:
          timeout: 0.5s
      - wait_until:
          condition:
            and:
              - not:
                  media_player.is_announcing:
              - not:
                  speaker.is_playing:
          timeout: 3s
      # A sound that still hasn't finished (bus taken) is cancelled, so the
      # media player can't keep retrying it in the background.
      - if:
          condition:
            media_player.is_announcing:
          then:
            - lambda: |-
                id(echo_media_player)->make_call()
                  .set_command(media_player::MEDIA_PLAYER_COMMAND_STOP)
                  .set_announcement(true)
                  .perform();
      - switch.turn_off: speaker_amp
      - script.execute: start_wake_word

# Self-heal: whatever path forgot to restart the wake word, a device that is
# connected but not listening is invisible from Jupiter (the connection
# alert stays green). If nothing at all is running for two checks in a row,
# listen again.
interval:
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  micro_wake_word.is_running:
              - switch.is_off: mute
              - switch.is_off: speaker_amp
              - not:
                  script.is_running: play_sound
          then:
            - lambda: id(deaf_checks) += 1;
            - if:
                condition:
                  lambda: return id(deaf_checks) >= 2;
                then:
                  - logger.log:
                      level: WARN
                      format: "Wake word was off with nothing else running: restarting it"
                  - lambda: id(deaf_checks) = 0;
                  - script.execute: start_wake_word
          else:
            - lambda: id(deaf_checks) = 0;
      # A voice run never legitimately lasts this long (Jess ends every run
      # within 30 s): one still "running" after ~45-60 s is wedged — stop it
      # (the check above then restarts the wake word).
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - lambda: id(va_busy_checks) += 1;
            - if:
                condition:
                  lambda: return id(va_busy_checks) >= 4;
                then:
                  - logger.log:
                      level: WARN
                      format: "Voice run stuck for ~60 s: stopping it"
                  - lambda: id(va_busy_checks) = 0;
                  - voice_assistant.stop:
          else:
            - lambda: id(va_busy_checks) = 0;

globals:
  - id: va_busy_checks
    type: int
    restore_value: no
    initial_value: "0"
  - id: deaf_checks
    type: int
    restore_value: no
    initial_value: "0"
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: "true"
