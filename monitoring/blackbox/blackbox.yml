# Blackbox Exporter Configuration
# HTTP health probes for Brain Gateway services

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 204]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false

  # Radicale's built-in server answers HTTP/1.0, which http_2xx rejects.
  http_2xx_http10:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.0", "HTTP/1.1"]
      valid_status_codes: [200]
      method: GET
      follow_redirects: false
      preferred_ip_protocol: "ip4"
      ip_protocol_fallback: false

  # No POST module: nothing probes with POST, and every container sharing a
  # probe network with blackbox (brain-frontend, grist, searxng) can call
  # /probe — a POST module would let one POST to prometheus:9090/-/quit.

  tcp_connect:
    prober: tcp
    timeout: 5s
