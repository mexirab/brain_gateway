# Monitoring Stack for Brain Gateway
# Usage:
#   cd monitoring
#   docker-compose --env-file ../.env -p monitoring up -d
#
# Or from project root:
#   docker-compose -f monitoring/docker-compose.yml -p monitoring up -d
#
# Environment variables are loaded from parent .env file

services:
  # ============================================
  # GRAFANA - Dashboard UI
  # ============================================
  grafana:
    # Digest pinned 2026-04-16 — matches supply-chain posture of promtail
    # pin below. Bump deliberately; `:latest` alone silently upgrades.
    image: grafana/grafana:latest@sha256:2e986801428cd689c2358605289c90ab37d2b39e24808874971f54c99bcdc412
    container_name: grafana
    restart: unless-stopped
    # Loopback only; Tailscale Serve proxies
    # https://jupiter-amds.tail74fc4a.ts.net:3000 (tailnet-only) here, so the
    # login never crosses the LAN in cleartext. Anonymous access is off: as an
    # anonymous Viewer anyone on the LAN could query Loki and Prometheus through
    # /api/ds/query.
    ports:
      - "127.0.0.1:${MONITORING_GRAFANA_PORT:-3000}:3000"
    volumes:
      - /mnt/logging/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      # Required (no default): a published fallback password is no password.
      # It only seeds a fresh grafana.db — to change it later run
      # `docker exec grafana grafana cli admin reset-admin-password '<new>'`
      # and update .env to match.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=${GF_USERS_ALLOW_SIGN_UP:-false}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Every browser path is HTTPS (Tailscale Serve); plain HTTP is loopback only.
      - GF_SECURITY_COOKIE_SECURE=true
    networks:
      - monitoring-net

  # ============================================
  # PROMETHEUS - Metrics Collection
  # ============================================
  prometheus:
    # Digest pinned 2026-04-16
    image: prom/prometheus:latest@sha256:5550dc63da361dc30f6fe02ac0e4dfc736ededfef3c8d12a634db04a67824d78
    container_name: prometheus
    restart: unless-stopped
    # Loopback only: with --web.enable-lifecycle, anyone who can reach this port
    # can POST /-/quit and stop all alerting. Grafana uses prometheus:9090 over
    # monitoring-net; scripts/reload-monitoring.sh uses localhost:9090.
    ports:
      - "127.0.0.1:${MONITORING_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # DIRECTORY mount, not per-file mounts: a single-file bind is pinned
      # to the inode at container start, and `git pull` (CI deploy) and most
      # editors replace files with new inodes — the container would keep
      # reading the pre-pull file while /-/reload reports success. A
      # directory mount resolves inner files by path on every access.
      # (Bit us 2026-07-06: an alert-rules.yml edit was invisible to the
      # running container until recreate.)
      - ./prometheus:/etc/prometheus:ro
      - /mnt/logging/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net

  # ============================================
  # LOKI - Log Aggregation
  # ============================================
  loki:
    # Digest pinned 2026-04-16
    image: grafana/loki:latest@sha256:73e905b51a7f917f7a1075e4be68759df30226e03dcb3cd2213b989cc0dc8eb4
    container_name: loki
    restart: unless-stopped
    # Loopback only: Loki has no auth, and anyone who could push to it could
    # plant log lines that the daily self-audit hands to the LLM. Reached as:
    #   loki:3100 over monitoring-net — Grafana, Jupiter promtail
    #   loki:3100 over gateway-net    — brain-orchestrator (SELF_AUDIT_LOKI_URL);
    #                                   containers can't reach Tailscale Serve on
    #                                   the host's own tailnet IP
    #   loki-push-gw:3101 on the LAN — Helios promtail, push-only, Helios IP only
    ports:
      - "127.0.0.1:${MONITORING_LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # Log-based alert rules (Helios hardware faults, brain CUDA failure).
      # Directory mount: the ruler re-reads it every minute, and a directory
      # mount survives git replacing the rule file's inode.
      - ./loki/rules:/etc/loki/rules:ro
      - /mnt/logging/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net
      - gateway-net
      - loki-push-net

  # ============================================
  # LOKI PUSH GATEWAY - Helios → Loki, push only
  # ============================================
  # Loki has no auth, so it stays loopback-only. This nginx is the single
  # off-box way in: POST /loki/api/v1/push, from Helios's IP AND with the
  # LOKI_PUSH_TOKEN bearer token, rate-limited, on the LAN (not the tailnet —
  # Helios's Tailscale login can lapse, and log shipping must survive that).
  # Read/query/delete/rules never leave the host. Planted log lines are the
  # residual risk (they reach the self-audit LLM). ufw is inactive on Jupiter,
  # so the bind address, IP allow-list and token are the exposure controls.
  loki-push-gw:
    # Digest pinned 2026-10-17 (nginx 1.28.2 stable, unprivileged: uid 101).
    # The only LAN-exposed listener in this stack — bump with the other pins.
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    container_name: loki-push-gw
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # The entrypoint renders templates/ into conf.d at start; pid + temp
      # paths live in /tmp for the unprivileged image. Both must be owned by
      # uid 101 — a root-owned tmpfs makes envsubst skip the render and nginx
      # starts with no server block (listens on nothing).
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /tmp:uid=101,gid=101,mode=0755
    environment:
      # The one host allowed to push (an IP — nginx `allow` takes no hostnames).
      # Unset → 127.0.0.1, i.e. nobody off-box: fail closed on other installs.
      - HELIOS_IP=${NODE_HELIOS_IP:-127.0.0.1}
      # Shared secret Helios promtail sends as a bearer token (same value in
      # Helios's /opt/promtail-helios/.env). Unset/empty → every push is 403.
      - LOKI_PUSH_TOKEN=${LOKI_PUSH_TOKEN:-}
    ports:
      # LAN bind only when NODE_JUPITER_IP is set (this deployment's .env);
      # otherwise loopback, so a fresh install exposes nothing.
      - "${NODE_JUPITER_IP:-127.0.0.1}:3101:3101"
    volumes:
      - ./loki-push-gw/templates:/etc/nginx/templates:ro
    depends_on:
      - loki
    # Its own network with Loki only: an nginx compromise must not reach
    # Alertmanager (unauthenticated silences), Prometheus, blackbox /probe or
    # anything else on monitoring-net.
    networks:
      - loki-push-net

  # ============================================
  # PROMTAIL - Log Shipper (for Docker containers on Jupiter)
  # ============================================
  # Scrapes Jupiter's own Docker socket + conjure's PM2 file logs and
  # pushes to the local Loki. The Helios compose has a second promtail
  # that covers brain-orchestrator et al.
  #
  # Hardening matches the Helios sidecar: image pinned by digest
  # (supply-chain protection — the Docker socket mount gives this
  # container read access to every container's env, which holds secrets),
  # cap_drop ALL, no-new-privileges. Bump the digest deliberately.
  promtail:
    image: grafana/promtail:3.4.2@sha256:c6e9a987ca086cbfef945b8ebd708eb09f98b5e78bfb659e4e5a8b3bd604d11b
    container_name: promtail
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Conjure PM2 logs (bare Node.js process, not Docker)
      - /opt/conjure/server/logs:/opt/conjure/server/logs:ro
    # -config.expand-env mirrors the Helios sidecar so the two configs
    # stay structurally identical; no env vars are used in this config
    # today, but adding it now prevents a future parameterisation from
    # silently no-op'ing.
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - monitoring-net
    depends_on:
      - loki

  # ============================================
  # ALERTMANAGER - Alert Routing (Pushover)
  # ============================================
  # The config is GENERATED: alertmanager/alertmanager.yml is rendered from
  # alertmanager.yml.template by scripts/generate-configs.sh, which injects
  # PUSHOVER_USER_KEY/PUSHOVER_APP_TOKEN from ../.env. The rendered file is
  # gitignored — after editing the template, re-run the generator and
  # `curl -X POST localhost:9093/-/reload` (CI does both on deploy).
  # Folded in here 2026-07-06, replacing a hand-run container that
  # bind-mounted a stale render from the old /opt/gateway_mvp checkout.
  alertmanager:
    # Digest pinned 2026-07-06 — same supply-chain posture as the pins above.
    image: prom/alertmanager:latest@sha256:af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a
    container_name: alertmanager
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Loopback-only, deliberately narrower than the hand-run container's
      # 0.0.0.0 bind: the API is unauthenticated (anyone who can reach it
      # can create silences or inject fake "Jess alert" pushes) and every
      # consumer is local — Prometheus/Grafana use in-network DNS
      # (alertmanager:9093), CI reloads via localhost. ufw is inactive on
      # Jupiter, so this bind IS the exposure control.
      - "127.0.0.1:${MONITORING_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      # Directory mount for the same inode-replacement reason as prometheus
      # above (generate-configs.sh truncates in place, but don't depend on it).
      - ./alertmanager:/etc/alertmanager:ro
      - /mnt/logging/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring-net

  # ============================================
  # BLACKBOX EXPORTER - HTTP Health Probes
  # ============================================
  blackbox-exporter:
    # Digest pinned 2026-04-16
    image: prom/blackbox-exporter:latest@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: blackbox-exporter
    restart: unless-stopped
    # Loopback only: /probe?target=... is an unauthenticated request proxy to
    # anything the container can route to (monitoring-net services like
    # actual-budget, radicale, loki by name, plus LAN/tailnet hosts), so it must
    # not be LAN-reachable. Prometheus scrapes it as blackbox-exporter:9115;
    # scripts/reload-monitoring.sh uses localhost:9115.
    ports:
      - "127.0.0.1:${MONITORING_BLACKBOX_PORT:-9115}:9115"
    # Directory mount, not a single-file mount: a file mount is pinned to the
    # inode at container start, so a `git pull` edit to blackbox.yml stays
    # invisible even across /-/reload (bit us 2026-10-15 with http_2xx_http10).
    # scripts/reload-monitoring.sh reloads + content-verifies it.
    volumes:
      - ./blackbox:/etc/blackbox_exporter:ro
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    # frontend-probe-net: probes the dashboard as brain-frontend:3001 (it may
    # publish on loopback only). Deliberately NOT gateway-net: see the network
    # comment in the main docker-compose.yml.
    # grist-probe-net: probes grist:8484/status without Grist joining
    # monitoring-net (see grist/docker-compose.yml for why it's isolated).
    # searxng-probe-net: probes searxng:8080/healthz (published on loopback
    # only).
    networks:
      - monitoring-net
      - frontend-probe-net
      - grist-probe-net
      - searxng-probe-net

  # NODE EXPORTER runs on host (systemd), not in container

networks:
  monitoring-net:
    driver: bridge
  # Created by the main compose project; Loki joins it so the orchestrator can
  # reach it. Bring the main stack up first (`docker compose down` there deletes
  # the network); if it was recreated, re-run `up -d` here. Every compose command
  # for this project needs `--env-file ../.env` (GF_SECURITY_ADMIN_PASSWORD is required).
  gateway-net:
    name: gateway_nerves_gateway-net
    external: true
  # Created by the main compose project (brain-frontend + blackbox only).
  frontend-probe-net:
    name: gateway_nerves_frontend-probe-net
    external: true
  # Created by the main compose project (searxng + blackbox only).
  searxng-probe-net:
    name: gateway_nerves_searxng-probe-net
    external: true
  # loki-push-gw ↔ loki only (see loki-push-gw above).
  loki-push-net:
    driver: bridge
  # blackbox-exporter ↔ grist only. Fixed name: grist/ joins it as external.
  grist-probe-net:
    name: monitoring_grist-probe-net
    driver: bridge

# Data stored on /mnt/logging (sdb1 - 931GB HDD)
