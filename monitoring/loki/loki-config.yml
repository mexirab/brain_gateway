# Loki Configuration for Brain Gateway
# Stores logs locally with 30-day retention

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # The ruler logs ~4 info lines per rule per evaluation (~11k/day), which
  # Jupiter's promtail ships straight back into Loki. Warnings and up only.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  # Log-based alerts (monitoring/loki/rules/fake/*.yml, mounted read-only;
  # "fake" is the tenant id Loki uses when auth_enabled is false). Alerts go to
  # the same Alertmanager as Prometheus, so routing lives in one place.
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  evaluation_interval: 1m
  # No auth on Loki: don't let callers write rules over HTTP.
  enable_api: false

limits_config:
  retention_period: 720h  # 30 days
  # Backstop for the read-only self-investigator: no query (any client) reaches
  # further back than 7 days, matching the self-audit's own lookback ceiling
  # (SELF_AUDIT_LOOKBACK_HOURS <= 168). Loki clamps the start rather than
  # erroring. Note: Grafana Explore is limited to 7 days too.
  max_query_lookback: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_streams_per_user: 10000
  max_line_size: 256kb
  # No auth on Loki: an open delete API lets anything that reaches it wipe
  # the error streams and turn the self-audit into a false "all clean".
  deletion_mode: disabled

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
