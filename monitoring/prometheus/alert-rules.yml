groups:
  - name: brain_gateway_critical
    interval: 30s
    rules:
      # -- Service Health -------------------------------------------------------
      - alert: OrchestratorDown
        expr: up{job="orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Brain Gateway orchestrator is down"
          description: "The orchestrator has not responded to /metrics scrapes for 2 minutes."

      # uranus is EXCLUDED deliberately. It has been unreachable since
      # 2026-07-04 and is not in the runtime path, so including it would mean
      # this alert pages every repeat_interval (4h) forever about a box everyone
      # already knows is dead — and an alert that always fires is one nobody
      # reads. Until this exclusion was added NodeDown was routed to the "null"
      # receiver for exactly that reason, which meant a REAL node going down
      # (jupiter, helios, saturn) notified nobody at all. Excluding the known-dead
      # node is what makes paging on the rest safe.
      # When uranus comes back: drop the node!= matcher. Do NOT instead re-point
      # this at "null".
      - alert: NodeDown
        expr: up{job="node-exporter", node!="uranus"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is down"
          description: "Node exporter on {{ $labels.node }} is unreachable for 3 minutes."

      # Non-paging counterpart so the excluded node is still VISIBLE on the
      # dashboard rather than silently dropped from monitoring entirely.
      # Deliberately not in the alertmanager allow-list — Grafana-only.
      - alert: UranusDown
        expr: up{job="node-exporter", node="uranus"} == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "uranus (test box) is unreachable"
          description: "Known-dead since 2026-07-04 and excluded from NodeDown paging. This exists so the box does not vanish from monitoring; if it is genuinely back, remove the node!=\"uranus\" matcher on NodeDown and delete this rule."

      # -- Storage substrate ----------------------------------------------------
      # /mnt/logging is an EXTERNAL USB disk (WDC WD10EZEX, /dev/sde1) holding the
      # Prometheus TSDB, Loki chunks, and Grafana state. On 2026-07-15 the USB hub
      # dropped for 65s ("usb 4-1: USB disconnect"); the disks re-enumerated under
      # new letters and nothing remounted. Prometheus then crashlooped on
      # "permission denied: /prometheus/queries.active" — it was writing to the
      # bare root-owned mountpoint showing through underneath — and monitoring was
      # blind for 3 days before anyone noticed.
      #
      # absent() is the right detector: node-exporter stops publishing
      # node_filesystem_* for a mountpoint entirely when it is not mounted, so a
      # threshold on free bytes would never fire — the series just vanishes.
      #
      # LIMITATION, read before trusting this: this only fires in the window where
      # the mount is gone but Prometheus is still running on its open file
      # descriptors. Once Prometheus restarts it cannot start, and a dead
      # Prometheus evaluates no rules — same circular problem as
      # AlertmanagerUnreachable below. Closing that gap needs an EXTERNAL deadman
      # (Alertmanager Watchdog -> healthchecks.io or similar), which does not
      # exist yet. Treat this as "catches the common case", not "cannot miss".
      # Sharper still: `for: 5m` restarts its timer on every Prometheus restart,
      # so the real window is not "until Prometheus dies" but "until Prometheus
      # first restarts" — after that the pending period can never complete.
      #
      # The `and on() up{...} == 1` guard is load-bearing: absent() returns 1 for
      # ANY reason the series stops arriving, including a dead node or a failed
      # scrape. Without it, a Jupiter reboot pages "the USB disk has dropped",
      # which is false, and double-pages alongside NodeDown (which fires 2m
      # earlier at for: 3m). Tradeoff being accepted knowingly: if the `node`
      # label is ever renamed, the guard breaks too and this goes SILENT rather
      # than paging forever. For a page, fail-silent beats fail-screaming — but
      # it is still a blind spot that only an external deadman would catch.
      #
      # job="node-exporter" is not redundant: prometheus.yml.template scrapes
      # netdata with honor_labels: true, so a colliding node_filesystem_* series
      # carrying node="jupiter" would satisfy absent() and silently disable this
      # alert. Pinning the job keeps that fail-open path closed.
      #
      # All three /mnt/* disks live in the SAME USB enclosure and dropped
      # together on 2026-07-15, so each gets its own rule. They are deliberately
      # NOT collapsed into one mountpoint=~"/mnt/(logging|documents|media)"
      # matcher: absent() over a regex returns 1 only when EVERY matching series
      # vanishes, so a single failed disk — the more likely failure — would be
      # silently invisible while the alert sat green.
      - alert: LoggingMountMissing
        expr: >-
          absent(node_filesystem_size_bytes{job="node-exporter", node="jupiter", mountpoint="/mnt/logging"})
          and on() (up{job="node-exporter", node="jupiter"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring storage /mnt/logging is not mounted on Jupiter"
          description: "node-exporter reports no filesystem at /mnt/logging while the node is up. The USB disk backing Prometheus/Loki/Grafana has dropped. Prometheus will crashloop on its next restart and ALL alerting dies with it. Check `dmesg | grep -i usb` for a disconnect, confirm the disk is present (`lsblk -o NAME,TRAN,SIZE`), then: STOP the monitoring stack first (`docker compose -f monitoring/docker-compose.yml stop`) — containers started while the mount was missing hold FDs on the root-filesystem path underneath, and mounting over them leaves Prometheus writing to the shadowed directory while the disk sits idle. Then `mount /mnt/logging`, start the stack, and confirm `docker inspect prometheus --format '{{.RestartCount}}'` is 0."

      - alert: DocumentsMountMissing
        expr: >-
          absent(node_filesystem_size_bytes{job="node-exporter", node="jupiter", mountpoint="/mnt/documents"})
          and on() (up{job="node-exporter", node="jupiter"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Document storage /mnt/documents is not mounted on Jupiter"
          description: "node-exporter reports no filesystem at /mnt/documents while the node is up. This disk backs Paperless-ngx — scanned documents, its media/originals, AND its Postgres data directory. Losing it mid-write is what left paperless-db throwing 500s for three weeks after the 2026-07-15 dropout. usb-storage-remount.service should have remounted it automatically within ~10s; if this alert is firing, that recovery did NOT work — check `systemctl status usb-storage-remount.service` and `dmesg | grep -i usb`. Then stop paperless (`docker compose -f /opt/paperless/docker-compose.yml stop`), `mount /mnt/documents`, and start it again so Postgres runs crash recovery against the real disk."

      - alert: MediaMountMissing
        expr: >-
          absent(node_filesystem_size_bytes{job="node-exporter", node="jupiter", mountpoint="/mnt/media"})
          and on() (up{job="node-exporter", node="jupiter"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Media storage /mnt/media is not mounted on Jupiter"
          description: "node-exporter reports no filesystem at /mnt/media while the node is up. This disk holds the Immich photo library (~41GB) and its Postgres data directory, plus audiobooks/ebooks/podcasts. Immich Postgres logged 'could not open file global/pg_control: Input/output error' when this vanished on 2026-07-15. usb-storage-remount.service should have remounted it automatically; if this is firing, that recovery failed — check `systemctl status usb-storage-remount.service`. Then stop immich (`docker compose -f /opt/immich/docker-compose.yml stop`), `mount /mnt/media`, and start it so Postgres recovers cleanly."

      # Dashboard-only by design: when this fires Prometheus can't deliver
      # notifications at all, so routing it anywhere via alertmanager is
      # circular. It exists so the failure is visible in Grafana instead of
      # every alert silently going nowhere.
      - alert: AlertmanagerUnreachable
        expr: prometheus_notifications_alertmanagers_discovered < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus has no reachable Alertmanager"
          description: "prometheus_notifications_alertmanagers_discovered has been < 1 for 5 minutes — alerts are firing into the void. Check the alertmanager container in the monitoring compose project."

      - alert: TTSDown
        expr: probe_success{service=~"tts|tts-voxcpm"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TTS service {{ $labels.service }} (Helios) is down"
          description: "{{ $labels.service }} has not responded for 5 minutes (tts = Qwen3-TTS :8002, tts-voxcpm = VoxCPM2 :8004; whichever TTS_URL points at is the live voice). Diagnose with journalctl -u qwen-tts / voxcpm-tts on Helios."

      - alert: STTDown
        expr: probe_success{service="stt"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "STT service (Helios) is down"
          description: "Whisper STT has not responded for 5 minutes. Voice input unavailable."

      # -- Error Rates ----------------------------------------------------------
      - alert: HighErrorRate
        expr: rate(bgw_request_errors_total[5m]) / rate(bgw_requests_total[5m]) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Brain Gateway (>10%)"
          description: "{{ $value | humanizePercentage }} of requests are failing over the last 5 minutes."

      - alert: HighToolErrorRate
        expr: rate(bgw_tool_call_errors_total[10m]) / rate(bgw_tool_calls_total[10m]) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High tool failure rate (>20%)"
          description: "Tool {{ $labels.tool }} is failing at {{ $value | humanizePercentage }}."

      # -- Latency --------------------------------------------------------------
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(bgw_request_duration_seconds_bucket[5m])) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency >30s"
          description: "95th percentile request latency is {{ $value | humanizeDuration }}."

      # -- Resource Alerts ------------------------------------------------------
      - alert: HighGPUTemp
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU temperature critical on {{ $labels.node }}"
          description: "GPU temp is {{ $value }}C on {{ $labels.node }}."

      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint=~"/|/mnt/logging"} / node_filesystem_size_bytes{mountpoint=~"/|/mnt/logging"}) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk >90% full on {{ $labels.node }} {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} is {{ $value | humanizePercentage }} full."

      # Helios GPU0 (RTX 5090) is included again since 2026-10-02: the brain is
      # llama.cpp (llama-server-primary.service), whose ~92% is real allocation
      # (weights + 131K q8_0 KV), not a vLLM pre-allocation. Creep past 95%
      # (e.g. vision encoder buffers on top of the static set) is a real signal.
      - alert: HighVRAMUsage
        expr: nvidia_smi_memory_used_bytes / nvidia_smi_memory_total_bytes > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VRAM >95% on {{ $labels.node }}"
          description: "VRAM usage is {{ $value | humanizePercentage }} on {{ $labels.node }}."

      # Memory offline: the embedding model can't encode (startup self-test).
      # Memory search, RAG context, palace writes and auto_learn all fail per
      # call — it went unnoticed for 12 days (2026-10-02 → 10-15). Paging.
      - alert: EmbeddingModelBroken
        expr: bgw_embedding_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Embedding model can't encode — Jess's memory is offline"
          description: "The startup self-test failed: memory search, RAG context, memory-palace writes and auto_learn all fail. Check `docker logs brain-orchestrator | grep EMBEDDING` and the transformers pin in orchestrator/requirements.txt (nomic remote code needs transformers<5.12)."

  - name: brain_gateway_informational
    interval: 60s
    rules:
      - alert: CalendarSourceFailing
        # Replaces CalendarPollingFailed (which watched the Google-only
        # bgw_calendar_api_errors_total and went dead when calendar reads moved
        # to calendar_sources). Fires when Radicale or Google keeps failing
        # reads from the orchestrator — including what RadicaleDown can't see
        # (401 after a password change, a REPORT error). Poll alone reads every
        # 5 min, so >6 errors/h is sustained, not one blip. Work-push staleness
        # has its own alert (ExchangeCalendarSyncStale).
        expr: sum by (source) (increase(bgw_calendar_source_fetch_total{source=~"caldav|google",result=~"error|timeout"}[1h])) > 6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Calendar source '{{ $labels.source }}' keeps failing"
          description: "Jess couldn't read the {{ $labels.source }} calendar more than 6 times in the last hour — briefings say so, but events may be missing. Check `docker logs radicale` / the CALDAV_* settings, or Google OAuth."

      # Real streaming: a stream that dies AFTER emitting returns a silently
      # truncated answer to the user (no user-facing error). Non-paging — it's
      # a UX degradation, not an outage — but on-call should see a sustained
      # rate. for:2m rides out the increase() counter-reset blip on CI restarts.
      - alert: ChatStreamTruncating
        expr: increase(bgw_chat_stream_outcome_total{outcome="died_mid_emission"}[1h]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Chat streams are dying mid-answer — users get truncated replies"
          description: "{{ $value | humanize }} stream(s) died after emitting in the last hour; the user received a silently truncated answer. Check `systemctl status llama-server-primary` / `journalctl -u llama-server-primary` on Helios and the '[UNIFIED] Stream died mid-answer' lines in Loki."

      - alert: EmptyRepliesReachingUsers
        expr: increase(bgw_llm_empty_reply_total{outcome="still_empty"}[1h]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Jess answered with nothing — even after the empty-reply retry"
          description: "{{ $value | humanize }} turn(s) in the last hour returned a blank reply. The brain ended its turn immediately (look for 1-token completions in `journalctl -u llama-server-primary` on Helios and '[UNIFIED] Empty reply after thinking retry' in Loki). If it persists, the voice-mode enable_thinking=false path is the first suspect."

  # ===========================================================================
  # Self-Hosted App Server (Jupiter)
  # ===========================================================================
  # Lightweight self-hosted apps (Actual Budget, etc.) run on Jupiter and are
  # probed by the blackbox-http job. Every app target carries tier="app", so
  # this one rule covers all of them — adding an app means adding a scrape
  # target in prometheus.yml, not a new alert here.
  - name: app_server
    interval: 30s
    rules:
      - alert: AppDown
        expr: probe_success{tier="app"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Self-hosted app '{{ $labels.service }}' is down"
          description: "{{ $labels.service }} on {{ $labels.node }} has failed its HTTP probe for 2 minutes."
      - alert: RadicaleDown
        # The self-hosted calendar (source of truth for personal events). AppDown
        # also fires for it but is Grafana-only; this one routes to pushover-quiet.
        # restart: unless-stopped does NOT act on an unhealthy container, so a hung
        # Radicale stays hung until someone is told.
        expr: probe_success{service="radicale"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Radicale (calendar server) is down"
          description: "The CalDAV server on Jupiter has failed its HTTP probe for 5 minutes. iPhone calendar sync and Jess's calendar access are down. Check `docker logs radicale` and `cd ~/gateway_nerves/radicale && docker compose up -d` (also the fix for 'network not found' after a network was pruned)."
      - alert: ActualDown
        # Actual Budget (finance source of truth). Same shape as RadicaleDown:
        # AppDown is Grafana-only, BudgetSyncFailing only notices after ~6h, and
        # restart: unless-stopped ignores an unhealthy container.
        expr: probe_success{service="actual"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Actual Budget server is down"
          description: "Actual (container actual-budget, probed over monitoring-net) has failed its HTTP probe for 5 minutes. The budget web UI and Jess's finance sync are down. Check `docker logs actual-budget` and `cd ~/gateway_nerves/actual && docker compose up -d` (also the fix for 'network not found' after a network was pruned)."

  # ===========================================================================
  # UPS / Power Chain
  # ===========================================================================
  # Both UPSes feed Helios via NUT + nut_exporter on port 9199.
  # CyberPower CP1500PFCLCD = 1000W; Goldenmate 2000VA LiFePO4 (firmware-limited).
  - name: brain_gateway_ups
    interval: 30s
    rules:
      - alert: UPSOnBattery
        # ups_status flag goes 1 the instant grid power is lost. Sustained
        # `for: 30s` lets brief AC blips (transfer test, brownout flicker)
        # not page; anything beyond that is a real outage.
        expr: network_ups_tools_ups_status{flag="OB"} == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "UPS '{{ $labels.ups }}' on battery"
          description: "Grid lost on {{ $labels.ups }} — running on battery. Check input voltage panel."

      - alert: UPSLowBattery
        # LB flag means the UPS itself thinks it's about to die. Below 20% is the
        # secondary trigger. Either way we want a critical-severity page.
        expr: network_ups_tools_ups_status{flag="LB"} == 1 or network_ups_tools_battery_charge < 20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UPS '{{ $labels.ups }}' low battery ({{ $value }}%)"
          description: "Battery at {{ $value }}% — graceful shutdown imminent."

      - alert: UPSReplaceBattery
        expr: network_ups_tools_ups_status{flag="RB"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "UPS '{{ $labels.ups }}' wants battery replaced"
          description: "Self-test reported the battery should be replaced. Doesn't affect runtime today; plan a swap."

      - alert: UPSOverload
        # OVER flag, OR ups.load > 90% sustained.
        expr: network_ups_tools_ups_status{flag="OVER"} == 1 or network_ups_tools_ups_load > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "UPS '{{ $labels.ups }}' overloaded ({{ $value }}%)"
          description: "Load >90% of rated capacity. Will cut runtime sharply on grid loss."

      - alert: UPSExporterDown
        # The scrape itself failing — covers nut_exporter container down OR
        # NUT server (upsd) down OR the UPS USB cable yanked.
        expr: up{job="nut"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NUT exporter scrape failing for '{{ $labels.ups }}'"
          description: "Prometheus can't reach the nut_exporter for {{ $labels.ups }}. UPS itself may be fine — check Helios:9199 + upsd."

      - alert: UPSInputVoltageOutOfRange
        # CyberPower only — Goldenmate doesn't expose input.voltage.
        # Wide tolerance — 105V/130V is well past what HVAC/legitimate
        # brownouts cause. AVR (BOOST/TRIM flags) covers normal swings.
        expr: network_ups_tools_input_voltage{ups="cyberpower"} < 105 or network_ups_tools_input_voltage{ups="cyberpower"} > 130
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Wall voltage abnormal: {{ $value }}V on {{ $labels.ups }}"
          description: "Sustained out-of-range input voltage. Brownout, surge, or wiring issue."

  - name: brain_gateway_deadmans
    interval: 60s
    rules:
      - alert: MorningBriefingStale
        expr: time() - bgw_morning_briefing_last_run_timestamp_seconds > 93600 and bgw_morning_briefing_last_run_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Morning briefing has not fired in over a day"
          description: "Last briefing was {{ $value | humanizeDuration }} ago - should run daily; orchestrator/scheduler may be down."
      - alert: EveningBriefingStale
        # 25.5h (not the morning's 26h): for a 21:30 job a 26h threshold turns
        # true ~23:30 and pages at midnight; 25.5h + for 30m pages ~23:30 the
        # next night. Was 24.5h, which the 25h gap of the fall-back DST night
        # crossed (harmless while restarts zeroed the gauge; the heartbeat is
        # persisted across restarts since 2026-10-17).
        expr: time() - bgw_evening_briefing_last_run_timestamp_seconds > 91800 and bgw_evening_briefing_last_run_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Evening briefing has not fired in over a day"
          description: "Last evening ritual was {{ $value | humanizeDuration }} ago - should run daily; orchestrator/scheduler may be down."
      - alert: BudgetSyncFailing
        # Counter-based, not the last-success gauge: the gauge is 0 until the
        # first success after each restart, so a "gauge > 0" guard would never
        # fire for a sync that has NEVER succeeded (wrong password after a
        # deploy, an actual-server upgrade the pinned actualpy can't read).
        # 6h = 12 missed 30-min syncs. Silent when the sync is unconfigured
        # (no attempts at all). Quiet receiver: stale budget data isn't a page.
        expr: (sum(increase(bgw_budget_sync_total{result="error"}[6h])) > 0) unless (sum(increase(bgw_budget_sync_total{result="ok"}[6h])) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Actual Budget sync has not succeeded in 6h"
          description: "Every budget_sync attempt in the last 6h failed. Check `docker logs brain-orchestrator | grep '\\[ACTUAL\\]'`, GET /api/finance/sync/status (last_error), that the actual-budget container (:5006) is up, and that its version is compatible with the pinned actualpy."
      - alert: AnnouncementSpeakerUnavailable
        # HA 200s play_media on an `unavailable` Cast entity, so before
        # 2026-10-02 a dead speaker logged as a delivered announcement and the
        # bedroom briefing went silent for days unnoticed. _announce_voice now
        # skips dead targets and counts them here (series pre-seeded at 0 at
        # startup so the first hit counts). 24h window so it doesn't "resolve"
        # overnight when nothing announces and re-fire every morning; one
        # announcement to a dead speaker is enough. Physical fix (power-cycle /
        # re-pair in Google Home), not something that self-heals.
        expr: sum by (speaker) (increase(bgw_announcement_speaker_unavailable_total[24h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Speaker {{ $labels.speaker }} is unavailable — announcements to it are not playing"
          description: "Home Assistant reports {{ $labels.speaker }} unavailable, so Jess skipped it (and fell back to the reminder speakers if nothing else in the route was alive). Power-cycle the speaker; if it's a stereo pair that doesn't come back in HA, re-create the pair in Google Home."
      - alert: SelfAuditStale
        # Daily 07:00 job; 25.5h like the other daily heartbeats (DST + misfire
        # grace headroom). The gauge is re-seeded at startup from the persisted
        # real last-run time (not now()), so deploys don't mask a dead job.
        expr: time() - bgw_self_audit_last_run_timestamp_seconds > 91800 and bgw_self_audit_last_run_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Self-audit has not run in over a day"
          description: "Last self-audit completed {{ $value | humanizeDuration }} ago - should run daily. Check SELF_AUDIT_ENABLED/JESS_ADVANCED and `docker logs brain-orchestrator | grep SELF_AUDIT`."
      - alert: SelfAuditFailing
        # Two failed runs (Loki unreachable/empty) in 2 days with no ok/partial
        # run. One failure already pushes a CRITICAL digest; this catches the
        # "digest ignored for months" case (dead since June until 2026-10-02).
        # partial = Helios asleep, no LLM diagnosis — logs were still read, so
        # it counts as working. 1.5 absorbs increase() extrapolation.
        expr: (sum(increase(bgw_self_audit_runs_total{result="failed"}[2d])) >= 1.5) unless (sum(increase(bgw_self_audit_runs_total{result=~"ok|partial"}[2d])) > 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Self-audit has failed repeatedly"
          description: "The daily self-audit could not read Loki on its last runs, so it is blind. Check SELF_AUDIT_LOKI_URL (should be http://loki:3100 — Loki is loopback-only on the host and reached over gateway-net; a LAN IP no longer works), that Loki is up and still on gateway_nerves_gateway-net (`cd monitoring && docker compose --env-file ../.env -p monitoring up -d loki`), and that promtail is shipping logs."
      - alert: WindDownNudgeStale
        # 25.5h, matching the dashboard panel's orange threshold: the largest
        # legitimate gap is 25h (the DST fall-back night) plus the 300s
        # scheduler misfire grace, and 25.5h leaves ~25m of headroom above that.
        # The nudge is a spoken prompt — a dropped rung is invisible by
        # omission, and the feature targets the person least likely to notice.
        # Routed to the quiet (non-paging) Pushover receiver, not "null": a
        # comfort rung shouldn't page at midnight, but it must still surface.
        expr: time() - bgw_wind_down_last_run_timestamp_seconds > 91800 and bgw_wind_down_last_run_timestamp_seconds > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Wind-down nudge has not fired in over a day"
          description: "Last T-30 screens-away nudge was {{ $value | humanizeDuration }} ago - should run nightly; orchestrator/scheduler may have dropped the rung."
      - alert: SchedulerJobsMissed
        # APScheduler silently drops any job whose 300s misfire_grace_time lapses
        # during an event-loop stall (orchestrator/shared.py job_defaults). The
        # EVENT_JOB_MISSED listener (orchestrator.py) bumps this counter, keyed by
        # a bounded job_family. One-shot families (reminder, focus) have no next
        # occurrence and no runtime recovery, so a drop is a permanently lost
        # action. for: 2m (not 0m) only rides out the counter-reset extrapolation
        # blip that increase() can synthesize across an orchestrator restart
        # (in-process counter, CI redeploys on every merge) — a real miss keeps
        # this expr true for the full 15m window, so detection is unaffected.
        expr: sum by (job_family) (increase(bgw_scheduler_jobs_missed_total[15m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scheduler dropped a '{{ $labels.job_family }}' job"
          description: "The event loop stalled past the 300s misfire grace and APScheduler discarded {{ $value }} '{{ $labels.job_family }}' job(s) in the last 15m. One-shot jobs (reminders, focus breaks) are lost for good — check orchestrator logs for '[SCHEDULER] Job MISSED' and what stalled the loop."
      - alert: GoogleTokenRefreshStale
        expr: time() - jess_google_token_refresh_success_timestamp_seconds > 691200
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Google OAuth token refresh is stale (>8 days)"
          description: "Weekly token refresh has not succeeded in {{ $value | humanizeDuration }}. Check the cron + scripts/refresh_google_token.py."
      - alert: JessBackupStale
        expr: time() - jess_backup_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jess state backup is stale (>36h)"
          description: "The nightly state backup hasn't succeeded in {{ $value | humanizeDuration }}. Check the cron + scripts/backup_state.py — auto_learn.key and the SQLite state are unprotected until it runs."
      - alert: JessHABackupStale
        # Home Assistant now runs on Jupiter (migrated off the failed Pi 2026-07-04).
        # /home/labadmin/homeassistant/backup_ha.sh runs nightly and writes this.
        # >36h stale = a nightly HA backup was missed; the config (.storage/auth,
        # automations, entity registry) is unprotected until it runs.
        expr: time() - jess_ha_backup_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Home Assistant backup is stale (>36h)"
          description: "The nightly HA backup hasn't succeeded in {{ $value | humanizeDuration }}. Check the cron + /home/labadmin/homeassistant/backup_ha.sh."
      - alert: JessCalendarBackupStale
        # Radicale (self-hosted CalDAV, the personal calendar source of truth)
        # runs on Jupiter since 2026-10-14. radicale/backup_radicale.sh runs
        # nightly and writes this. >36h stale = the calendars are unprotected.
        expr: time() - jess_calendar_backup_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Calendar (Radicale) backup is stale (>36h)"
          description: "The nightly Radicale backup hasn't succeeded in {{ $value | humanizeDuration }}. Check the cron + /home/labadmin/gateway_nerves/radicale/backup_radicale.sh."
      - alert: JessActualBackupStale
        # Actual Budget (finance source of truth) on Jupiter. actual/backup_actual.sh
        # runs nightly and writes this. >36h stale = the budget is unprotected.
        expr: time() - jess_actual_backup_success_timestamp_seconds > 129600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Actual Budget backup is stale (>36h)"
          description: "The nightly Actual Budget backup hasn't succeeded in {{ $value | humanizeDuration }}. Check the cron + /home/labadmin/gateway_nerves/actual/backup_actual.sh (log: /home/labadmin/actual/backup.log)."
      - alert: ExchangeCalendarSyncStale
        # The work (Exchange) calendar only reaches Jess through the iPhone
        # Shortcut → POST /api/calendar/sync. If it stops (Shortcut disabled,
        # iOS automation needing a tap, phone off the tailnet), work meetings
        # silently vanish from briefings and alerts — the phone sync was dead
        # for three months in 2026 before anyone noticed. Gauge is seeded at
        # startup from the persisted push, so restarts don't reset it; 0 means
        # "never synced" (or only a retired legacy push) and stays quiet. The
        # time() side comes first so {{ $value }} is the age, not the epoch. 26h allows one missed daily run.
        expr: time() - bgw_phone_calendar_last_sync_timestamp_seconds > 93600 and bgw_phone_calendar_last_sync_timestamp_seconds > 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Work calendar hasn't synced from the iPhone in over a day"
          description: "Last iPhone calendar push was {{ $value | humanizeDuration }} ago — check the 'Sync work calendar to Jess' Shortcut automation (docs/CALENDAR.md → Work calendar)."
      - alert: JessBackupOffboxFailing
        # Covers all four nightly backups: state (jess_backup_*), HA
        # (jess_ha_backup_*), the Radicale calendar (jess_calendar_backup_*) and
        # Actual Budget (jess_actual_backup_*).
        expr: '{__name__=~"jess_(ha_|calendar_|actual_)?backup_offbox_success"} == 0'
        for: 3d
        labels:
          severity: info
        annotations:
          summary: "Off-box backup copy has been failing for 3 days ({{ $labels.__name__ }})"
          description: "Local backups are fine, but the rsync to Saturn keeps failing for {{ $labels.__name__ }} — a single-disk loss would still take that data. Check SSH keys / the remote path and the backup's cron log."

      # Fires only once bgw_tool_call_source_total exists (it ships on the
      # tool-call instrumentation branch); until then there is no series and this
      # is silently inactive, which is the correct behaviour rather than an error.
      #
      # source="dropped" means the model emitted a <tool_call> marker but no call
      # was parsed, so the agentic loop ended the turn early — the user watches
      # the assistant announce it will do something and then just stop. It is
      # user-visible breakage that produces no error anywhere else.
      #
      # Only "dropped" is alerted. "xml_fallback" is deliberately NOT: it is a
      # recovered call, and if the underlying defect is common it would be
      # permanently non-zero — a threshold alert on it would be a standing
      # nuisance. That one is dashboard-only.
      #
      # > 0 over 6h with for: 10m, not a rate(): Helios is power-tiered and the
      # box sees only ~18 model rounds/week, so any per-second rate is noise and
      # a narrow window would flap resolved between sparse events. Any single
      # occurrence is worth surfacing at this volume.
      - alert: ToolCallsSilentlyDropped
        expr: sum(increase(bgw_tool_call_source_total{source="dropped"}[6h])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model tool calls are being silently dropped (Qwen3.8 TURBO Q6_K on llama.cpp)"
          description: "A <tool_call> marker was present but no call parsed, so the loop ended the turn early and the user saw the assistant give up mid-task. Current stack (since 2026-10-02): DavidAU Qwen3.8-27B TURBO Fable Q6_K MTP GGUF on llama.cpp (llama-server-primary.service on Helios GPU0), --jinja tool/reasoning parsing, MTP speculative decoding (--spec-type draft-mtp); the cutover session saw no drops. Run `docker logs brain-orchestrator | grep 'SILENTLY DROPPED'` for the finish_reason, then `journalctl -u llama-server-primary` on Helios. If output also looks garbled, first lever is `--spec-type none` in the unit (disables MTP, ~45% slower). Rollback to the vLLM NVFP4 brain: on Helios `systemctl disable --now llama-server-primary && systemctl enable --now vllm-primary`, on Jupiter `cp .env.bak-qwen38-nvfp4 .env && docker compose up -d --force-recreate orchestrator` (see tts/llama-server-primary.service header)."
  - name: brain_gateway_routine
    rules:
      - alert: RoutineAutoEnded
        expr: increase(bgw_routine_auto_ended_total[6h]) > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "Routine auto-ended on a stuck step"
          description: "A routine step nudged past the cap and force-ended. Check the step skippable/auto_skip config."

  # Helios (GPU model layer) health beyond "is it up". Helios is power-tiered,
  # so these are written to stay quiet while it is deliberately asleep. The
  # log-based twins (HeliosHardwareFault, BrainCudaInitFailed) are Loki ruler
  # rules in monitoring/loki/rules/fake/helios.yml.
  - name: helios_health
    rules:
      # Jess's brain is generating, but at CPU speed. Normal decode on the 5090
      # is ~105-125 tok/s; CPU fallback measured ~6 tok/s on 2026-10-15 (driver
      # swap under a loaded module). Ratio of the two llama.cpp counters = mean
      # decode speed over the window. An idle brain gives 0/0 = NaN, and
      # NaN < 30 is false, so no traffic floor is needed — a floor hid the
      # 10-15 incident, where a CPU-bound brain produced only 7 tokens in 10 min
      # before chat timed out. Backtest 2026-10-03..17: the only 10-min windows
      # under 60 tok/s were that incident (6.8) and its restart (58).
      # HeliosGpuDriverBroken below fires hours earlier, without traffic.
      - alert: BrainOnCPU
        expr: |
          (
            rate(llamacpp:tokens_predicted_total{job="llama-primary"}[15m])
              / rate(llamacpp:tokens_predicted_seconds_total{job="llama-primary"}[15m])
          ) < 30
          and increase(llamacpp:tokens_predicted_total{job="llama-primary"}[15m]) >= 1
        for: 2m
        labels:
          severity: warning
          node: helios
        annotations:
          summary: "Jess's brain is generating at {{ $value | printf \"%.0f\" }} tok/s — likely on CPU"
          description: "Mean decode speed over 10 min is far below the ~110 tok/s the RTX 5090 does. Check `nvidia-smi` and `journalctl -u llama-server-primary -b | grep -i cuda` on Helios; a driver/library mismatch is fixed by a reboot."

      # nvidia-smi on Helios is failing while the box is up. Exit 18 is NVML's
      # "driver/library version mismatch": on 2026-10-15 unattended-upgrades
      # swapped the driver under the loaded kernel module, the brain restarted
      # onto CPU, and this metric read 18 from 06:30 to 12:00 — 5.5 h before
      # anyone noticed. No series while Helios sleeps, so sleep is silent.
      - alert: HeliosGpuDriverBroken
        expr: nvidia_smi_command_exit_code{job="gpu-exporter", node="helios"} != 0
        for: 5m
        labels:
          severity: warning
          node: helios
        annotations:
          summary: "nvidia-smi on Helios exits {{ $value }} — GPUs unusable"
          description: "The GPU exporter can't talk to the NVIDIA driver (18 = driver/library version mismatch, usually a driver package upgraded under the loaded module). The brain falls back to CPU (~6 tok/s) or fails to start. Fix: reboot Helios; check `apt-mark showhold` still holds the 580-server packages."

      # Helios has power but isn't answering: plug draws running-level watts
      # (idle ~120 W, off-but-plugged a few W) while node-exporter is down.
      # That is a hang or a dead NIC, not sleep — on 2026-10-16 the chipset NIC
      # died after IOMMU faults and the box sat powered and unreachable for 1.5 h.
      # NodeDown pages for the same outage; this one says which kind it is.
      # Needs fresh plug readings: HELIOS_PLUG_MONITOR_ENABLED (or
      # HELIOS_WAKE_ENABLED) on the orchestrator, else it never fires.
      # bgw_helios_running is recomputed on every successful read and drops to 0
      # when the power sensor reads unavailable, so a stale watts gauge (sensor
      # dropped out while Helios was up) can't fake a "powered" reading.
      - alert: HeliosPoweredButUnreachable
        expr: |
          bgw_helios_plug_watts > 60
          and on() bgw_helios_running == 1
          and on() increase(bgw_helios_status_total{result="ok"}[5m]) > 0
          and on() up{job="node-exporter", node="helios"} == 0
        for: 5m
        labels:
          severity: warning
          node: helios
        annotations:
          summary: "Helios is powered ({{ $value | printf \"%.0f\" }} W) but not reachable"
          description: "The smart plug shows Helios drawing running-level power, but its node exporter has not answered for 5+ minutes — hung, or its network card died (2026-10-16: chipset IOMMU faults). Plug in a monitor to look; a power-cycle via the plug recovers it."
