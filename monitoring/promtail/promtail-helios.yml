# Promtail Configuration — Helios node
# Ships Helios's systemd journal (model units, UPS units, kernel) to Loki on
# Jupiter. Runs from
# monitoring/promtail/docker-compose.helios.yml (its own compose project).
#
# Why the journal matters: the model servers are host systemd units, and
# hardware faults (IOMMU page faults, a dying USB controller or NIC, NVIDIA Xid)
# only show up in the kernel log. Before 2026-10 none of it reached Loki, so the
# self-audit and alerting were blind to Helios — a chipset IOMMU fault took the
# box off the network on 2026-10-16 with no log trail outside Helios.
#
# Run with: -config.expand-env=true   (so ${LOKI_PUSH_URL} is interpolated)

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

# Pushes over the LAN to loki-push-gw on Jupiter (nginx, push-only: Helios's IP
# + bearer token). Loki itself stays loopback-only on Jupiter. Plain http on the
# LAN: these lines carry no personal content (see the journal job below).
#
# No Docker job: everything Brain Gateway runs on Helios is a systemd unit now,
# and a docker-socket mount would hand this container root on the host (`:ro`
# doesn't restrict the Docker API). If containers come back, front the socket
# with a read-only socket proxy rather than mounting it.
clients:
  - url: ${LOKI_PUSH_URL}
    bearer_token: ${LOKI_PUSH_TOKEN}
    # A batch that exhausts its retries is dropped and the journal cursor has
    # already moved on. Default (10 retries, ≤5 min apart) gives up after ~8 min;
    # this rides out a Jupiter reboot or monitoring upgrade of ~2 h. 4xx (403 from
    # the gateway, 400 from Loki) are never retried — those lines are lost.
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 30

scrape_configs:
  # -- systemd journal: model servers, UPS, kernel ---------------------------
  # Allow-list, not a firehose: only the units Brain Gateway runs on Helios, the
  # systemd lifecycle lines about them (UNIT=, e.g. "Main process exited"), and
  # kernel messages. Checked 2026-10-17: these units log request shapes and
  # timings only (llama-server without --verbose logs token counts; TTS logs
  # `chars=N`; STT logs the request line) — no prompt, speech or transcript text.
  # Keep it that way: Loki keeps 30 days and the self-audit sends WARNING+ lines
  # to the LLM and Pushover.
  - job_name: journal
    journal:
      # Backfill window on first start (and after a long outage).
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: helios
    relabel_configs:
      - source_labels: ['__journal__systemd_unit', '__journal_unit', '__journal__transport']
        separator: ';'
        regex: '((llama-server-primary|voxcpm-tts|qwen-tts|stt-onnx|nut-server|nut-monitor|nut-driver@[^;]*)\.service;.*|[^;]*;(llama-server-primary|voxcpm-tts|qwen-tts|stt-onnx|nut-server|nut-monitor|nut-driver@[^;]*)\.service;.*|[^;]*;[^;]*;kernel)'
        action: keep
      # service = the unit name, from the unit's own lines or systemd's lines
      # about it; kernel lines get service="kernel". The self-audit selects on
      # {service=~".+"}, so every kept stream needs this label.
      - source_labels: ['__journal__systemd_unit']
        regex: '(.+)\.service'
        target_label: service
      - source_labels: ['__journal_unit']
        regex: '(.+)\.service'
        target_label: service
      - source_labels: ['__journal__transport']
        regex: 'kernel'
        target_label: service
        replacement: kernel
      - source_labels: ['__journal__transport']
        target_label: transport
      # Journal priority → the level names the self-audit and alerts expect
      # (it matches level=~"error|warning|warn|critical|fatal").
      - source_labels: ['__journal_priority_keyword']
        target_label: level
      - source_labels: ['__journal_priority_keyword']
        regex: 'err'
        target_label: level
        replacement: error
      - source_labels: ['__journal_priority_keyword']
        regex: '(crit|alert|emerg)'
        target_label: level
        replacement: critical
    pipeline_stages:
      # Health probes every 15 s from Jupiter's blackbox exporter are ~90% of the
      # TTS/STT volume and say nothing a probe_success metric doesn't.
      - drop:
          expression: '"GET /health HTTP'
      # Backstops for the no-personal-content rule. qwen-tts's streaming path
      # logged the first 50 chars of the sentence it failed to speak (fixed in
      # tts/server.py, but Helios runs whatever copy is deployed); and nothing
      # these units should log is anywhere near 2 KB, so a line that long is
      # more likely a dumped payload than a diagnostic.
      - drop:
          expression: 'Stream TTS failed for sentence'
      - drop:
          longer_than: 2048
      # No rate limit on the UPS units. A UPS driver that loses its USB link
      # (2026-10-16: the chipset USB controller died) logs ~1800 warnings an
      # hour — noisy, but exactly the evidence you want. A promtail `limit`
      # stage here dropped every nut-* line during the startup backfill
      # (2026-10-17). Open gap: a flap can fill the self-audit's single
      # 5000-line Loki window in ~3 h and push older errors out of the audit;
      # not handled yet — follow-up is to query Helios / nut-* separately in
      # orchestrator/jobs_self_audit.py. (A `limit` with drop: false is not the
      # fix: it backpressures the whole pipeline.)
      # The model units write to stdout, which journald stores at priority 6
      # (info) whatever the line says — so their own errors would arrive as
      # level="info" and the self-audit (level=~"error|warning|...") would skip
      # them. Re-derive the level from each format: llama.cpp prefixes
      # "<ts> E|W ", Python logging "[ERROR]"/"[WARNING]", uvicorn "ERROR:".
      # No backslashes in these selectors: -config.expand-env collapses "\\"
      # to "\" before LogQL parses them ("\S" then fails as an invalid escape
      # and promtail won't start). Bracket classes ([^ ], [[], []]) instead.
      - match:
          selector: '{service=~"llama-server-primary|voxcpm-tts|qwen-tts|stt-onnx"} |~ "^[^ ]+ E |[[](ERROR|CRITICAL)[]]|^(ERROR|CRITICAL):|^Traceback "'
          stages:
            - static_labels:
                level: error
      # llama.cpp prints six fixed W notices on every start (no API key, the
      # Qwen-VL image-token hint, reasoning preserved, future port change), and
      # two routine prompt-cache notices in normal use (evicting the oldest cache
      # entry, non-consecutive token position after cache reuse) — left at info
      # so each wake doesn't hand the self-audit new "warnings".
      - match:
          selector: '{service=~"llama-server-primary|voxcpm-tts|qwen-tts|stt-onnx"} |~ "^[^ ]+ W |[[]WARNING[]]|^WARNING:" !~ "no API key is set|Qwen-VL models require|image-min-tokens|issues/16842|preserving reasoning|default port will be changed|making room for prompt cache entry|non-consecutive token position"'
          stages:
            - static_labels:
                level: warning
      # upsmon logs "Communications with UPS … lost" / "Data stale" / "on
      # battery" at info (stdout); they are the UPS-side evidence of a USB or
      # power problem, so surface them as warnings for the self-audit.
      - match:
          selector: '{service="nut-monitor"} |~ "Communications with UPS .* lost|Data stale|on battery"'
          stages:
            - static_labels:
                level: warning

