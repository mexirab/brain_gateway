# Repo copy of /etc/jess-docker-input.conf (read by jess-docker-input.service).
# Which Jupiter host ports (INPUT) and private destinations (FORWARD) Docker
# containers may reach. Background, measurements and the reason for each line:
# docs/internal/CONTAINER_HOST_REACHABILITY.md (INPUT) and
# docs/internal/CONTAINER_LAN_REACHABILITY.md (FORWARD).
# Runbook: monitoring/README.md -> Container -> host firewall.
#
# The copy in /etc is the live one. This repo copy stays at `mode observe` and
# `forward-mode observe` as the safe default; the owner switches /etc to enforce
# by hand, each separately.
#
# After an edit on Jupiter:  sudo systemctl reload jess-docker-input
#   (the reload validates first and FAILS on a bad config, leaving the old rules)
# Check what it would load:  sudo jess-docker-input render
#
# mode observe = log what is not allowed, block nothing
# mode enforce = reject what is not allowed
mode observe

# allow <docker network name> <tcp|udp> <port>[,<port>...]   (max 15 ports per line)
#
# Only connections to processes on the host itself need a line. Container-to-
# container traffic and published ports reached from another network (Docker
# DNAT -> FORWARD) never enter the chain.
#
# A packet arrives on the bridge of its container's DEFAULT-ROUTE network, so
# each line names a dedicated network that is the default route (compose
# gw_priority) of the only containers that need the access.

# host-access (orchestrator only): HA 8123 (HA_URL), Pi-hole API 8053 (PIHOLE_URLS),
# VoxCPM 8004 via host.docker.internal, its own 8888 via the LAN IP (docker-proxy hairpin).
allow gateway_nerves_host-access tcp 8004,8053,8123,8888

# host-scrape (Prometheus + blackbox-exporter): Conjure 5050 (scrape + /health probe),
# VoxCPM 8004 (blackbox tts-voxcpm probe via host.docker.internal), node-exporter 9100,
# NVIDIA GPU exporter 9400, Netdata 19999.
allow monitoring_host-scrape tcp 5050,8004,9100,9400,19999

# TRANSITION, delete both lines once host-access and host-scrape exist (the
# compose change from PR #176 is deployed) and before switching to enforce:
# until then the orchestrator and Prometheus still leave through these networks.
allow gateway_nerves_gateway-net tcp 8004,8053,8123,8888
allow monitoring_monitoring-net tcp 5050,8004,9100,9400,19999

# ---------------------------------------------------------------------------
# FORWARD: container -> anything off Jupiter (LAN, router, tailnet, Jupiter's
# published ports). Background: docs/internal/CONTAINER_LAN_REACHABILITY.md.
#
# forward-mode off     = no FORWARD chains (also when this line is missing)
# forward-mode observe = log private destinations no line allows, block nothing
# forward-mode enforce = reject them (ICMP admin-prohibited)
# The internet is never filtered. The source check (a packet whose source isn't
# its bridge's subnet) follows `mode` on INPUT and `forward-mode` here.
forward-mode observe

# forward <docker network> <address>[/<len>] <tcp|udp> <port>[,<port>...]
#
# Matched on the address and port the container ASKED for (conntrack original
# destination), so a published port matches as reached, e.g. 10.0.0.248:8777.
# Prefixes shorter than /24 are refused; the router only on port 53.

# Default bridge: ad-hoc `docker run` containers and image builds (BuildKit RUN
# steps) resolve through the router (nameserver 10.0.0.1 from /etc/resolv.conf).
forward bridge 10.0.0.1 udp 53
forward bridge 10.0.0.1 tcp 53

# host-access (orchestrator): Helios STT 8003 (STT_URL), VoxCPM 8004 (the TTS
# rollback to Helios), llama-server 8080 (MODEL/VISION/FALLBACK_MODEL_URL);
# Saturn Pi-hole 8053 (PIHOLE_URLS); Paperless 8777 + its own API 8888 via
# Jupiter's LAN IP (published ports).
forward gateway_nerves_host-access 10.0.0.195 tcp 8003,8004,8080
forward gateway_nerves_host-access 10.0.0.58 tcp 8053
forward gateway_nerves_host-access 10.0.0.248 tcp 8777,8888
# Voice satellites, ESPHome API (VOICE_SATELLITE_DEVICES). One line per device
# with its address; the live /etc copy has them, this public copy doesn't:
# forward gateway_nerves_host-access <satellite address> tcp 6053

# host-scrape (Prometheus + blackbox-exporter): Helios STT + brain + VoxCPM probes,
# node-exporter, NUT exporter, GPU exporter, Netdata; Saturn + Uranus exporters
# and the dead-man's switch 9466; the orchestrator 8888 + Paperless 8777 probes.
forward monitoring_host-scrape 10.0.0.195 tcp 8003,8004,8080,9100,9199,9400,19999
forward monitoring_host-scrape 10.0.0.58 tcp 9100,9400,9466,19999
forward monitoring_host-scrape 10.0.0.173 tcp 9100,9400,19999
forward monitoring_host-scrape 10.0.0.248 tcp 8777,8888

# Alertmanager (monitoring-net is its only network): the self-audit webhook
# (orchestrator 8888) and the dead-man's switch heartbeat (Saturn 9466).
forward monitoring_monitoring-net 10.0.0.248 tcp 8888
forward monitoring_monitoring-net 10.0.0.58 tcp 9466

# TRANSITION, delete these lines once host-access and host-scrape exist (the
# compose change from PR #176 is deployed) and before forward-mode enforce:
# until then the orchestrator leaves through gateway-net, Prometheus through
# monitoring-net and blackbox-exporter through frontend-probe-net.
forward gateway_nerves_gateway-net 10.0.0.195 tcp 8003,8004,8080
forward gateway_nerves_gateway-net 10.0.0.58 tcp 8053
forward gateway_nerves_gateway-net 10.0.0.248 tcp 8777,8888
# forward gateway_nerves_gateway-net <satellite address> tcp 6053
forward monitoring_monitoring-net 10.0.0.195 tcp 8080,9100,9199,9400,19999
forward monitoring_monitoring-net 10.0.0.58 tcp 9100,9400,19999
forward monitoring_monitoring-net 10.0.0.173 tcp 9100,9400,19999
forward gateway_nerves_frontend-probe-net 10.0.0.195 tcp 8003,8004,8080
forward gateway_nerves_frontend-probe-net 10.0.0.248 tcp 8777,8888
