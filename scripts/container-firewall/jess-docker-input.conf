# Repo copy of /etc/jess-docker-input.conf (read by jess-docker-input.service).
# Which Jupiter host ports Docker containers may reach. Background, measurements
# and the reason for each line: docs/internal/CONTAINER_HOST_REACHABILITY.md.
# Runbook: monitoring/README.md -> Container -> host firewall.
#
# The copy in /etc is the live one. This repo copy stays at `mode observe` as the
# safe default; the owner switches /etc to enforce by hand.
#
# After an edit on Jupiter:  sudo systemctl reload jess-docker-input
#   (the reload validates first and FAILS on a bad config, leaving the old rules)
# Check what it would load:  sudo jess-docker-input render
#
# mode observe = log what is not allowed, block nothing
# mode enforce = reject what is not allowed
mode observe

# allow <docker network name> <tcp|udp> <port>[,<port>...]   (max 15 ports per line)
#
# Only connections to processes on the host itself need a line. Container-to-
# container traffic and published ports reached from another network (Docker
# DNAT -> FORWARD) never enter the chain.
#
# A packet arrives on the bridge of its container's DEFAULT-ROUTE network, so
# each line names a dedicated network that is the default route (compose
# gw_priority) of the only containers that need the access.

# host-access (orchestrator only): HA 8123 (HA_URL), Pi-hole API 8053 (PIHOLE_URLS),
# VoxCPM 8004 via host.docker.internal, its own 8888 via the LAN IP (docker-proxy hairpin).
allow gateway_nerves_host-access tcp 8004,8053,8123,8888

# host-scrape (Prometheus + blackbox-exporter): Conjure 5050 (scrape + /health probe),
# VoxCPM 8004 (blackbox tts-voxcpm probe via host.docker.internal), node-exporter 9100,
# NVIDIA GPU exporter 9400, Netdata 19999.
allow monitoring_host-scrape tcp 5050,8004,9100,9400,19999
