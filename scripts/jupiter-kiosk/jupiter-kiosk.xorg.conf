# X server config for the closet kiosk on Jupiter. Installed as /etc/X11/jupiter-kiosk.conf and
# passed as `-config jupiter-kiosk.conf` (a rootless X server only takes a name under /etc/X11).
#
# The X server must live on the DISPLAY card only. Jupiter has two RTX 5080s: the voice
# (voxcpm-tts) is on PCI bus 0b, and the monitors are on bus 0c (the card with two HDMI ports).
# Without a BusID and ProbeAllGpus "false", the NVIDIA X driver opens every GPU, the voice card
# included. kiosk.py --preflight (ExecStartPre) refuses to start if this BusID names the card
# /etc/voxcpm-tts.env pins. If the cards ever move: `nvidia-smi --query-gpu=pci.bus_id --format=csv`
# and write the monitor card's bus in DECIMAL here (0x0c = 12). Exactly one BusID line.

Section "ServerFlags"
    Option "AutoAddGPU"  "false"
    Option "AutoBindGPU" "false"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    # No keyboards or mice, ever: the kiosk needs no input, and a keyboard plugged into Jupiter would
    # otherwise drive a browser that holds the dashboard session (DevTools, file:// pages). Also no
    # Ctrl+Alt+Fn VT switch and no Ctrl+Alt+Backspace. Get a console over SSH instead
    # (`sudo systemctl stop jupiter-kiosk && sudo systemctl start getty@tty1`).
    Option "AutoAddDevices"    "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch"      "true"
    Option "DontZap"           "true"
EndSection

Section "Device"
    Identifier "display-5080"
    Driver     "nvidia"
    BusID      "PCI:12:0:0"
    Option     "ProbeAllGpus" "false"
    # The driver's GL sideband socket. A non-root X can't write the default /var/run; with /tmp it binds
    # /tmp/nvidia-xdriver-* in the unit's PrivateTmp, AND (always) an abstract @tmp/nvidia-xdriver-*,
    # which every process in the host network namespace can send to (Home Assistant and Pi-hole are
    # host-networked containers). Known limit: README → Security.
    Option     "SidebandSocketPath" "/tmp"
    Option     "ConnectToAcpid" "false"
EndSection

Section "Screen"
    Identifier "kiosk-screen"
    Device     "display-5080"
EndSection

Section "ServerLayout"
    Identifier "kiosk"
    Screen     "kiosk-screen"
EndSection
