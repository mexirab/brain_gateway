# The closet kiosk user's own systemd manager. Installed as
# /etc/systemd/system/user@<uid of kiosk>.service.d/50-jupiter-kiosk.conf.
#
# Chrome talks to it over D-Bus (it puts itself in an app scope there), and any code running as the
# kiosk user could ask it to start a transient unit (what `systemd-run --user` does). Without this,
# that unit would run outside jupiter-kiosk.service's hardening: the host's whole file system and
# setuid binaries within reach. Same restrictions as the kiosk unit, so nothing gains by going through
# the manager. (The user slice's memory and network limits already cover it.)
[Service]
NoNewPrivileges=yes
RestrictSUIDSGID=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
InaccessiblePaths=-/mnt -/home -/root -/srv -/opt/conjure -/opt/homepage -/opt/apps
InaccessiblePaths=-/dev/nvidia0 -/dev/dri/card0 -/dev/dri/renderD128
