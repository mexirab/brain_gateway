# Limits for the closet kiosk. Installed as /etc/systemd/system/user-<uid of kiosk>.slice.d/50-jupiter-kiosk.conf
# (README → Install fills in the uid and the Tailscale address).
#
# Why a user slice and not the unit: PAMName= makes pam_systemd move X, kiosk.py and Chrome into the
# kiosk user's session scope, so cgroup settings in jupiter-kiosk.service would silently do nothing.
# Everything the kiosk user runs (session + user@.service) sits under this slice.
[Slice]
# Measured 2026-11-24: ~860 MiB, ~330 tasks, <1 % of a core. Behind the orchestrator and HA for CPU.
MemoryHigh=2G
MemoryMax=3G
TasksMax=1024
CPUWeight=20
# Network: only Jupiter's Tailscale address, where the two pages are. Not even loopback: several
# loopback-only services on Jupiter have no auth (Alertmanager, Prometheus, Blackbox /probe, SearXNG,
# Loki...). No DNS is needed (kiosk.json host_map maps the one name). Chrome can't reach Google either,
# whatever --disable-background-networking misses. Other ports on that address (SSH, the orchestrator,
# HA...) are reachable, as they are from the LAN.
IPAddressDeny=any
IPAddressAllow=@TAILSCALE_IP@
